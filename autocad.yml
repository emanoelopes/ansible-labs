---
# Instala o AutoCAD 2027 nas estações Windows.
#
#   teste em UMA máquina:  ansible-playbook autocad.yml -e alvo=lab1 --limit 112
#   laboratório inteiro:   ansible-playbook autocad.yml -e alvo=lab1
#
# Requer o espelho HTTP no ar:
#   ansible-playbook repo_local.yml
#
# ── ATENÇÃO: ESTE É O INSTALADOR WEB ──────────────────────────────────────
#
# O arquivo é o 'webinstall', um iniciador de ~75 MB que BAIXA o produto da
# Autodesk durante a instalação. Consequências:
#
#   - cada estação puxa de 6 a 10 GB da internet, não do Samba;
#   - com 26 máquinas, são 150 a 260 GB de tráfego externo;
#   - os domínios da Autodesk precisam estar acessíveis da rede dos labs;
#   - a instalação leva dezenas de minutos por máquina.
#
# Por isso o serial baixo: 4 máquinas por vez, para não saturar o link de
# saída. Prefira executar fora do horário de aula.
#
# A alternativa que elimina tudo isso é criar uma imagem de implantação
# offline (opção "Criar implantação" no instalador), que baixa uma vez e
# serve as 26 estações do compartilhamento local.

- name: AutoCAD 2027
  hosts: "{{ alvo | default('nao_definido') }}"
  gather_facts: false

  # 4 por vez: o gargalo aqui é o link de internet, não as máquinas.
  serial: 4

  vars:
    autocad_arquivo: 'Autodesk_AutoCAD_2027_1_Brazilian_Portuguese_pt-BR_setup_webinstall.exe'
    # Subpasta dentro de windows_instaladores. Atenção à caixa: 'autoCAD'.
    autocad_subpasta: 'autoCAD'
    autocad_destino: 'C:\Temp'

    # Parâmetro de instalação silenciosa dos instaladores ODIS (Autodesk
    # 2021+). NÃO VERIFICADO para o iniciador web desta versão — a
    # documentação da Autodesk descreve '-q' para o setup.exe da mídia
    # completa. Teste numa máquina e ajuste se necessário.
    # Outras formas documentadas:
    #   --silent --sn <numero_serie> --installdir "<caminho>"
    autocad_args: '-q'

    # Caminho usado pelo 'creates': se existir, a tarefa é pulada. É o que
    # torna o playbook repetível sem reinstalar.
    autocad_exe: 'C:\Program Files\Autodesk\AutoCAD 2027\acad.exe'

    # Instalação do AutoCAD leva muito tempo. 2h de teto, conferindo a cada
    # 60s. Sem isso o WinRM derruba a conexão por inatividade.
    autocad_timeout: 7200

  tasks:
    - name: Verificar se o AutoCAD já está instalado
      ansible.windows.win_stat:
        path: "{{ autocad_exe }}"
      register: autocad_check

    - name: Encerrar para esta máquina se já estiver instalado
      ansible.builtin.meta: end_host
      when: autocad_check.stat.exists

    # O instalador da Autodesk recusa-se a rodar quando há reinicialização
    # pendente, e sai rápido com código diferente de zero — foi o que
    # aconteceu na 135 (rc=11 em 1m37s, sem chegar a baixar nada).
    # Reiniciar antes evita o falso diagnóstico de "instalador quebrado".
    - name: Verificar reinicialização pendente
      ansible.windows.win_shell: |
        $p = @()
        if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') { $p += 'CBS' }
        if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired') { $p += 'WindowsUpdate' }
        if (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue) { $p += 'PendingFileRename' }
        $p -join ','
      changed_when: false
      register: reboot_pendente

    - name: Reiniciar antes de instalar, se houver pendência
      ansible.windows.win_reboot:
        reboot_timeout: 900
        msg: "Reinicialização necessária antes de instalar o AutoCAD."
      when: reboot_pendente.stdout | trim | length > 0

    - name: Garantir o diretório temporário
      ansible.windows.win_file:
        path: "{{ autocad_destino }}"
        state: directory

    - name: Baixar o iniciador do espelho HTTP
      ansible.windows.win_get_url:
        url: "{{ repo_interno_url }}/{{ autocad_subpasta }}/{{ autocad_arquivo }}"
        dest: "{{ autocad_destino }}\\{{ autocad_arquivo }}"
        force: no

    - name: Instalar o AutoCAD 2027
      ansible.windows.win_command: >-
        {{ autocad_destino }}\{{ autocad_arquivo }} {{ autocad_args }}
      args:
        chdir: "{{ autocad_destino }}"
        creates: "{{ autocad_exe }}"
      async: "{{ autocad_timeout }}"
      poll: 60
      register: autocad_install
      # 3010 e 11 significam 'instalou, mas precisa reiniciar' na maioria dos
      # instaladores. Não são falha — a verificação do acad.exe logo abaixo é
      # que decide se deu certo.
      failed_when: autocad_install.rc not in [0, 11, 3010]

    - name: Reiniciar se a instalação pediu
      ansible.windows.win_reboot:
        reboot_timeout: 900
      when: autocad_install.rc | default(0) in [11, 3010]

    # Sem esta espera, a verificação alcança a máquina no meio de um
    # desligamento e o WinRM devolve 'Illegal operation attempted on a
    # registry key that has been marked for deletion' — que parece erro grave
    # e é apenas o serviço sendo encerrado.
    #
    # Acontece porque o instalador pode disparar a própria reinicialização, e
    # porque máquinas com atualização do Windows represada reiniciam mais de
    # uma vez para aplicá-las.
    - name: Aguardar a máquina estar acessível
      ansible.builtin.wait_for_connection:
        delay: 30
        sleep: 15
        timeout: 1800

    - name: Confirmar a instalação
      ansible.windows.win_stat:
        path: "{{ autocad_exe }}"
      register: autocad_final
      # Nova rede de segurança: se ainda assim pegar a máquina instável,
      # tenta de novo em vez de dar o playbook por falhado.
      until: autocad_final is succeeded
      retries: 5
      delay: 30

    - name: Falhar se o executável não apareceu
      ansible.builtin.fail:
        msg: >-
          O instalador terminou mas {{ autocad_exe }} não existe em
          {{ inventory_hostname }}. Provavelmente o parâmetro
          '{{ autocad_args }}' não é aceito pelo iniciador web, ou o download
          da Autodesk falhou. Rode numa máquina sem -q para ver o assistente
          e o erro real.
      when: not autocad_final.stat.exists

    - name: Remover o iniciador
      ansible.windows.win_file:
        path: "{{ autocad_destino }}\\{{ autocad_arquivo }}"
        state: absent

    # O instalador web baixa os componentes para C:\Autodesk e não limpa a
    # pasta ao terminar — cerca de 4 GB por máquina. Num parque onde a falta
    # de espaço impediu instalações, deixar isso para trás é caro.
    #
    # Só remove depois de confirmado que o acad.exe existe: se a instalação
    # falhou, o cache serve para uma nova tentativa sem baixar tudo de novo.
    - name: Remover o cache de instalação da Autodesk
      ansible.windows.win_file:
        path: 'C:\Autodesk'
        state: absent
      when: autocad_final.stat.exists | default(false)
