---
# Coleta o MAC de cada estação e grava um mapa por laboratório.
#
#   ansible-playbook coletar_macs.yml -e alvo=lab6
#
# Alimenta o acordar.yml (Wake-on-LAN). Rode com as máquinas LIGADAS — só se
# coleta o MAC de quem responde.
#
# ── POR QUE UM PLAYBOOK PRÓPRIO, E NÃO A TAG DO site.yaml ────────────────
# O site.yaml usa 'serial: 25%'. A tarefa de gravação é run_once, então roda
# uma vez por leva e reescreve o arquivo: o resultado final continha apenas a
# última leva de máquinas. Aqui não há serial, e todas entram de uma vez.

- name: Coletar MAC das estações
  hosts: "{{ alvo | default('nao_definido') }}"
  gather_facts: true

  tasks:
    - name: Confirmar que o alvo foi informado
      ansible.builtin.fail:
        msg: "Informe o laboratório: ansible-playbook coletar_macs.yml -e alvo=lab6"
      when: alvo is not defined
      run_once: true
      delegate_to: localhost

    # No Windows o MAC vem de ansible_interfaces, uma lista de placas.
    # 'ansible_default_ipv4.macaddress' é fato de Linux e não existe aqui —
    # foi o que fez a primeira coleta sair vazia.
    #
    # Escolhe-se a placa com default_gateway definido: é a que fala com a
    # rede. Máquinas com Wi-Fi, VPN ou adaptadores virtuais têm várias.
    # ── macOS e Linux: o fato é outro ─────────────────────────────────────
    #
    # 'ansible_interfaces' tem formatos DIFERENTES por sistema:
    #   Windows -> lista de dicionários, com default_gateway, macaddress etc.
    #   macOS   -> lista de NOMES de interface (texto puro: en0, en1, lo0)
    #
    # O selectattr da tarefa seguinte espera dicionário e quebraria no lab3.
    # Nesses sistemas o caminho certo é ansible_default_ipv4.macaddress — o
    # mesmo fato que, no Windows, NÃO existe e fez a primeira coleta sair
    # vazia em 01/09/2026. O erro de então, invertido.
    - name: Identificar a placa de rede ativa (macOS e Linux)
      ansible.builtin.set_fact:
        mac_ativo: "{{ ansible_default_ipv4.macaddress | default('') }}"
        nome_placa: "{{ ansible_default_ipv4.interface | default('?') }}"
      when: ansible_os_family | default('') != 'Windows'

    - name: Identificar a placa de rede ativa
      when: ansible_os_family | default('') == 'Windows'
      ansible.builtin.set_fact:
        mac_ativo: >-
          {{ (ansible_interfaces
              | selectattr('default_gateway', 'defined')
              | selectattr('default_gateway', 'ne', None)
              | map(attribute='macaddress') | list | first)
             | default(ansible_interfaces
                       | selectattr('macaddress', 'defined')
                       | map(attribute='macaddress') | list | first, true)
             | default('', true) }}
        nome_placa: >-
          {{ (ansible_interfaces
              | selectattr('default_gateway', 'defined')
              | selectattr('default_gateway', 'ne', None)
              | map(attribute='connection_name') | list | first)
             | default('?', true) }}

    - name: Avisar quando nenhuma placa foi identificada
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: nenhum MAC encontrado em ansible_interfaces.
          Placas vistas: {{ ansible_interfaces | default([]) | length }}.
      when: mac_ativo | length == 0

- name: Gravar o mapa
  hosts: "{{ alvo | default('nao_definido') }}"
  gather_facts: false

  tasks:
    # ── A COLETA SOMA, NÃO SUBSTITUI ──────────────────────────────────────
    #
    # Sem isto, coletar com '--limit 127,136,147' reescreveria o arquivo
    # inteiro a partir dos três hosts da execução, e o mapa do lab1 cairia
    # de 24 MACs para 3. O mesmo valeria para uma coleta em que só parte do
    # laboratório estivesse ligada — o caso normal.
    #
    # É a mesma classe do defeito de 01/09/2026, quando 'serial: 25%' com
    # 'run_once' fazia cada leva sobrescrever a anterior e só a última
    # sobrevivia. Ali a perda era visível na hora; aqui seria silenciosa.
    #
    # MAC de máquina não muda, então o valor antigo continua bom até a placa
    # ser trocada. Quando isso acontecer, a coleta nova sobrepõe a antiga —
    # a ordem do combine abaixo garante que o recém-lido vence.
    - name: Ler o mapa anterior, se existir
      ansible.builtin.stat:
        path: "{{ inventario_dir }}/macs-{{ alvo }}.yml"
      register: mapa_antigo
      delegate_to: localhost
      become: false
      run_once: true

    - name: Carregar o mapa anterior
      ansible.builtin.include_vars:
        file: "{{ inventario_dir }}/macs-{{ alvo }}.yml"
        name: anterior
      when: mapa_antigo.stat.exists
      run_once: true

    # Parte-se do mapa anterior. Em tarefa separada da acumulação porque
    # chaves definidas num mesmo set_fact não enxergam umas às outras.
    - name: Partir do mapa anterior
      ansible.builtin.set_fact:
        macs_final: "{{ anterior.macs | default({}) }}"
      run_once: true

    # Um combine por máquina. Poderia ser uma expressão única com zip e
    # dict, mas ficaria ilegível — e este arquivo já custou caro em
    # expressões espertas demais.
    - name: Acrescentar o que foi coletado agora
      ansible.builtin.set_fact:
        macs_final: >-
          {{ macs_final | combine({
               item: {
                 'mac': hostvars[item].mac_ativo | lower,
                 'placa': hostvars[item].nome_placa | default('?'),
                 'hostname': hostvars[item].ansible_hostname | default('?') | lower,
                 'ip': hostvars[item].ansible_host | default('?')
               }
             }) }}
      loop: "{{ ansible_play_hosts | sort }}"
      loop_control:
        label: "{{ item }}"
      when: hostvars[item].mac_ativo | default('') | length > 0
      run_once: true

    - name: Gravar macs-{{ alvo }}.yml
      ansible.builtin.copy:
        dest: "{{ inventario_dir }}/macs-{{ alvo }}.yml"
        mode: "0640"
        content: |
          ---
          # Gerado por coletar_macs.yml em {{ '%Y-%m-%d %H:%M' | strftime }}
          #
          # ACUMULATIVO: entradas de coletas anteriores são preservadas. Uma
          # coleta parcial (--limit, ou laboratório meio desligado) acrescenta
          # e atualiza, nunca apaga.
          #
          # Nesta execução responderam {{ ansible_play_hosts | length }} de
          # {{ groups[alvo] | length }} máquina(s) do {{ alvo }}.
          macs:
          {% for h in macs_final.keys() | sort %}
            "{{ h }}":
              mac: "{{ macs_final[h].mac }}"
              placa: "{{ macs_final[h].placa | default('?') }}"
              hostname: "{{ macs_final[h].hostname | default('?') }}"
              ip: "{{ macs_final[h].ip | default('?') }}"
          {% endfor %}
          {% for h in groups[alvo] | sort %}
          {% if h not in macs_final %}
          # {{ h }}: sem MAC — nunca respondeu a uma coleta
          {% endif %}
          {% endfor %}
      delegate_to: localhost
      become: false
      run_once: true

    - name: Resumo
      ansible.builtin.debug:
        msg: |
          {{ alvo }} — mapa de MACs

          {#
            'select(\"length\")' NÃO existe — nem como teste do Jinja nem do
            Ansible, e 'length' é filtro. A expressão anterior usava isso e
            teria falhado em tempo de execução. Aqui se usa selectattr e
            rejectattr, que são padrão.
          #}
          {% set coletados = ansible_play_hosts | map('extract', hostvars)
             | selectattr('mac_ativo', 'defined')
             | rejectattr('mac_ativo', 'equalto', '') | list | length %}
          Coletados nesta execução: {{ coletados }} de {{ ansible_play_hosts | length }} máquina(s) alcançada(s)
          No mapa, somando com coletas anteriores: {{ macs_final | length }} de {{ groups[alvo] | length }}
          {% set faltam = groups[alvo] | reject('in', macs_final) | list %}
          {% if faltam | length > 0 %}

          Ainda sem MAC: {{ faltam | join(', ') }}
          Repita com essas máquinas ligadas — a coleta é acumulativa, nada
          se perde ao rodar de novo.
          {% endif %}

          Arquivo: {{ inventario_dir }}/macs-{{ alvo }}.yml
      run_once: true
