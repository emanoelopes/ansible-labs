---
# Distingue máquina DESLIGADA de máquina LIGADA COM CONEXÃO ERRADA.
#
#   ansible-playbook alcance.yml -e alvo=lab1
#   ansible-playbook alcance.yml -e alvo=lab1 --limit 136
#
# Somente leitura, roda do controlador, não toca nas estações. Seguro com
# aula em andamento.
#
# ── POR QUE ISTO EXISTE ───────────────────────────────────────────────────
#
# A auditoria e o inventário tratam máquina inalcançável como informação de
# cobertura, não como alerta — e com razão: estação desligada é o estado
# normal fora do horário de aula, e alertar sobre isso toda semana
# transformaria o relatório em ruído.
#
# O problema é que "desligada" e "WinRM mal configurado" produzem
# exatamente o mesmo silêncio. Foi assim que o lab5 inteiro ficou fora da
# automação por tempo indeterminado: o inventário o declarava na porta 5986
# com transporte 'basic', o listener HTTPS não existia mais, todas as
# conexões davam timeout, e nada nunca acusou nada. Descobriu-se por acaso.
#
# A distinção é possível sem depender do WinRM: uma máquina LIGADA aceita
# conexão em alguma porta. Se 445 ou 135 respondem e a 5985 não, a estação
# está de pé e o problema é de configuração — não de energia.
#
# ── POR QUE NÃO USAR PING ─────────────────────────────────────────────────
# O firewall do Windows bloqueia ICMP echo por padrão em vários perfis.
# Ausência de ping não prova nada, e presença tampouco distingue. Portas
# TCP são sinal melhor porque um serviço só responde se o sistema subiu.

# ── POR QUE 'hosts: alvo' COM 'connection: local' ─────────────────────────
# A primeira versão usava 'hosts: localhost' e percorria groups[alvo] por
# dentro. Funcionava, mas '--limit' passava a não ter efeito nenhum: ele
# filtra a lista de hosts da play, que era só o localhost — e
# 'alcance.yml --limit 127,136' terminava com "no hosts matched".
#
# Agora a play tem como alvo as próprias estações, mas com connection:
# local. O Ansible não tenta conectar em nenhuma delas: cada host serve de
# item de iteração, e as sondagens saem do controlador contra o ansible_host
# correspondente. Assim '--limit' volta a se comportar como nos demais
# playbooks, que é o que qualquer um espera.
- name: Diagnosticar alcance das estações
  hosts: "{{ alvo | default('nao_definido') }}"
  connection: local
  gather_facts: false

  vars:
    # Segundos por porta. Baixo de propósito: são cinco portas por máquina,
    # e o valor alto só faz a checagem de um laboratório inteiro demorar.
    espera: 2
    portas:
      - { numero: 5985, nome: 'WinRM HTTP' }
      - { numero: 5986, nome: 'WinRM HTTPS' }
      - { numero: 445,  nome: 'SMB' }
      - { numero: 135,  nome: 'RPC' }
      - { numero: 22,   nome: 'SSH' }

  tasks:
    - name: Confirmar que o alvo foi informado
      ansible.builtin.fail:
        msg: "Informe o laboratório: ansible-playbook alcance.yml -e alvo=lab1"
      when: alvo is not defined
      run_once: true

    # ── delegate_to É OBRIGATÓRIO AQUI ────────────────────────────────────
    #
    # 'connection: local' na play NÃO basta: a variável ansible_connection,
    # definida em [lab3:vars] e [labN:vars] no inventário, tem precedência
    # MAIOR que a palavra-chave da play. Sem delegação, o Ansible tenta
    # conectar de verdade em cada estação — por SSH no lab3, por WinRM nos
    # demais — e falha com UNREACHABLE exatamente nas máquinas que este
    # playbook existe para diagnosticar.
    #
    # Constatado em 15/09/2026 na 325 do lab3: as cinco sondagens abortaram
    # com "No route to host" na porta 22, sem chegar a sondar porta nenhuma.
    #
    # delegate_to: localhost decide onde a tarefa RODA, e não é afetado por
    # ansible_connection do alvo. O host da play vira só o item de iteração,
    # que é o que se queria desde o início.
    - name: Sondar as portas
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ item.numero }}"
        timeout: "{{ espera }}"
        state: started
      delegate_to: localhost
      loop: "{{ portas }}"
      loop_control:
        label: "{{ inventory_hostname }}:{{ item.numero }}"
      register: sonda
      # ignore_errors, e NÃO failed_when: false.
      #
      # 'failed_when: false' sobrescreve o campo 'failed' de TODO item para
      # falso — inclusive dos que falharam. O rejectattr abaixo então mantém
      # tudo, e cada porta sondada aparece como aberta. Foi o que fez a 325
      # do lab3, que não responde a nada, ser classificada como respondendo
      # nas cinco portas, em 15/09/2026.
      #
      # 'ignore_errors' não aborta a execução e PRESERVA o failed de cada
      # item, que é o que a classificação precisa ler.
      #
      # Mesmo erro que o relatório de falhas do estado_lab tinha, corrigido
      # em 09/09/2026 — e reintroduzido aqui por descuido.
      ignore_errors: true
      changed_when: false

    - name: Guardar as portas que responderam
      ansible.builtin.set_fact:
        portas_abertas: >-
          {{ sonda.results | rejectattr('failed')
             | map(attribute='item.numero') | list }}
        # Porta pela qual a automação fala com ESTA máquina: 5985 nos labs
        # Windows, 22 no lab3 e nos hosts SSH. Vem do inventário, então o
        # relatório deixa de presumir WinRM em laboratório de iMac.
        porta_gerencia: "{{ ansible_port | default(5985) | int }}"

    # A classificação vive no template do relatório: em Ansible ela exigiria
    # quatro set_fact encadeados, e ficaria mais difícil de acompanhar do
    # que o laço que a produz.
    # run_once: o relatório é do laboratório inteiro. Sem isto ele seria
    # impresso uma vez por máquina, idêntico, 27 vezes.
    - name: Relatório
      run_once: true
      ansible.builtin.debug:
        msg: "{{ relatorio.split('\n') }}"
      vars:
        relatorio: |
          ══════════════════════════════════════════════════════════════
          ALCANCE — {{ alvo | upper }}
          {{ '%Y-%m-%d %H:%M' | strftime }}
          ══════════════════════════════════════════════════════════════

          {% set resp = [] %}{% set errada = [] %}{% set liga_sem = [] %}{% set mortas = [] %}
          {% for h in ansible_play_hosts | sort %}
          {% set p = hostvars[h].portas_abertas | default([]) %}
          {% set pg = hostvars[h].porta_gerencia | default(5985) | int %}
          {#
            A porta que importa vem do inventário (ansible_port), e não é
            fixa: 5985 nos labs Windows, 22 no lab3 de iMacs. Antes o
            relatório dizia "responde no WinRM" para máquina macOS.
          #}
          {% if pg in p %}{% set _ = resp.append(h) %}
          {% elif pg == 5985 and 5986 in p %}{% set _ = errada.append(h) %}
          {% elif p | length > 0 %}{% set _ = liga_sem.append((h, p)) %}
          {% else %}{% set _ = mortas.append(h) %}{% endif %}
          {% endfor %}
          ─── RESPONDEM NA PORTA DE GERÊNCIA — nada a fazer ────────────
            {{ resp | length }} de {{ ansible_play_hosts | length }}{% if resp %}: {{ resp | join(', ') }}{% endif %}

          ─── LIGADAS, MAS FORA DO ALCANCE DA AUTOMAÇÃO ────────────────
          Estas estão de pé e a automação não as alcança. É o caso que a
          auditoria NÃO acusa, porque inalcançável passa por desligada.
          {% for h in errada %}
            {{ h }}   respondeu na 5986 (WinRM HTTPS), e o inventário
                aponta para a 5985
                → ou a estação está com listener HTTPS, ou o grupo dela no
                  inventory.ini está errado. Foi o caso do lab5 inteiro até
                  01/09/2026, e ninguém percebeu por tempo indeterminado.
          {% endfor %}
          {% for h, p in liga_sem %}
            {{ h }}   respondeu em {{ p | join(', ') }}, mas não na
                {{ hostvars[h].porta_gerencia | default('?') }}, que é por onde a automação fala com ela
                → sistema no ar e serviço de gerência ausente ou parado.
                  Exige configuração na máquina; não se resolve pelo Ansible.
          {% endfor %}
          {% if not errada and not liga_sem %}
            (nenhuma)
          {% endif %}

          ─── SEM RESPOSTA EM NENHUMA PORTA ────────────────────────────
          Provavelmente desligadas. Se uma delas deveria estar ligada,
          aí sim é defeito ou problema de rede.
            {{ mortas | length }}{% if mortas %}: {{ mortas | join(', ') }}{% endif %}

          ══════════════════════════════════════════════════════════════
          {% if errada or liga_sem %}
          {{ (errada | length) + (liga_sem | length) }} máquina(s) ligadas e invisíveis para a automação.

          Este é o número que importa: estação desligada volta sozinha na
          próxima aula; estação mal configurada não volta nunca.
          {% else %}
          Nenhuma máquina ligada está fora do alcance da automação.
          {% endif %}
          ══════════════════════════════════════════════════════════════
