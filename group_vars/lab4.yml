---
# Estado desejado do laboratório 4.
#
# Núcleo comum em group_vars/windows.yml (estado_pacotes_base, 14 pacotes).
# Aqui só o que o lab4 tem a mais.
#
# Derivado de inventario/software-lab4.txt (ago/2026), 93% de cobertura —
# 25 de 27 máquinas na ocasião. Hoje o lab4 tem 26 hosts ativos: a 437 foi
# recolhida por defeito em 26/08/2026 (patrimônio 346118, Trello HpxDDP24).
#
# Hardware: Dell OptiPlex 7010, CPU Mark 4664. Sem os pacotes pesados de
# modelagem 3D e motores de jogo que o lab1 tem.

estado_pacotes_extra:
  # ── Navegadores ───────────────────────────────────────────────────
  - firefox

  # ── IDEs e editores ───────────────────────────────────────────────
  - pycharm-community
  - notepadplusplus
  - androidstudio

  # ── Desenvolvimento ───────────────────────────────────────────────
  - github-desktop
  - bitvise-ssh-client
  - autohotkey.portable

  # DECLARADO EM 08/09/2026 — 25 de 26 máquinas, faltava só na 425.
  # Justificado pelo mapa de salas: Programação para Web I e Teste de
  # Software Aplicado, ambas alocadas neste laboratório.
  - postman

  # Subsistema Linux. Estava instalado nas máquinas, e o playbook wsl.yml
  # cuida da ativação do recurso do Windows, que o pacote sozinho não faz.
  - wsl2

  # DECLARADO EM 08/09/2026 — 24 de 26, faltava na 426 e na 437.
  #
  # Havia uma incoerência: o laboratório declarava 'wsl2' e não declarava
  # quem o usa. O Docker Desktop roda sobre o WSL2, então o subsistema
  # estava garantido e a ferramenta que justifica sua presença, não.
  #
  # Mapa de salas: Programação para Web I, Banco de Dados I e Redes de
  # Computadores. É pacote pesado e exige virtualização habilitada na BIOS
  # — se falhar em alguma máquina, o relatório de falhas do estado_lab
  # aponta qual.
  - docker-desktop

  # ── Estatística ───────────────────────────────────────────────────
  - r.project
  - r.studio

  # ── Design e áudio ────────────────────────────────────────────────
  - fontforge
  - asio4all

  # ── Eletrônica ────────────────────────────────────────────────────
  - arduino

  # ── Rede ──────────────────────────────────────────────────────────
  - wireshark

  # ── Periféricos ───────────────────────────────────────────────────
  - wacom-drivers

# REMOVIDOS DO RASCUNHO — dispersão de Python.
# O inventário achou 'python3' e 'python314' além do 'python' do núcleo.
# São três entradas para a mesma linguagem: 'python' é metapacote que
# aponta para o python3 mais recente, e 'python3' vem por dependência.
# Declarar os três deixaria interpretadores concorrendo no PATH.
#  - python3
#  - python314

# ── HERANÇA DE IMAGEM DA 437 ─────────────────────────────────────────────
# Registrados como pontuais para o relatório parar de devolvê-los como
# decisão em aberto. Não foram instalações a pedido: chegaram junto com o
# disco.
#
# A 437 recebeu, em 04/09/2026, uma máquina vinda da posição 141 do lab1
# (patrimônio 2020004283, Dell OptiPlex 3070). Ficou o SSD que veio com
# ela, então roda a imagem do lab1 — clone da 143, Windows 11 Pro. O
# estado.yml instala a lista do lab4 por cima, e 'present' não remove nada.
#
# Os quatro abaixo são declarados no lab1, para Inteligência Computacional
# Aplicada a Jogos I e Ferramentas de Modelagem Tridimensional I. No lab4
# não têm disciplina que os justifique.
#
# A previsão de que apareceriam foi registrada no inventory.ini antes de
# haver dado; o relatório de 08/09/2026 a confirmou: seção 3b inteira do
# lab4, quatro pacotes, todos 1/26, todos na 437.
#
# Uniformizar de verdade exigiria reimagem — não é coisa que a lista de
# estado resolva.
estado_pacotes_pontuais:
  - pacote: unity-hub
    posicoes: ['437']
    motivo: 'Herança da imagem do lab1, que veio no SSD da máquina'
    data: '2026-09-04'

  - pacote: blender
    posicoes: ['437']
    motivo: 'Herança da imagem do lab1, que veio no SSD da máquina'
    data: '2026-09-04'

  - pacote: epicgameslauncher
    posicoes: ['437']
    motivo: 'Herança da imagem do lab1, que veio no SSD da máquina'
    data: '2026-09-04'

  - pacote: python313
    posicoes: ['437']
    motivo: 'Herança da imagem do lab1, que veio no SSD da máquina'
    data: '2026-09-04'

estado_pacotes_versao: present

estado_plano_energia: 'Equilibrado'
estado_desligar_hora: '23:00'
estado_autologon_usuario: aluno
