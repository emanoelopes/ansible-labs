---
# Credencial de conexão das estações Windows (grupo [windows:children]
# no inventory.ini).
#
# A conta 'suporte' é administrativa e compartilhada entre a equipe. Com estas
# variáveis definidas, não é mais necessário passar -k na linha de comando:
#
#   antes:  ansible-playbook site.yaml -e local=lab1 -k
#   agora:  ansible-playbook site.yaml -e local=lab1
#
# A senha real fica cifrada em group_vars/all/vault.yml.
#
# Esta variável é usada EXCLUSIVAMENTE para conexão. Nenhuma role define ou
# altera a senha desta conta — trocá-la quebraria o acesso da equipe.
ansible_user: suporte
ansible_password: "{{ vault_senha_suporte }}"

# ── Núcleo de software comum aos laboratórios Windows ────────────────────
#
# Presente em todas as máquinas de lab1, lab4 e lab6 no inventário de
# ago/2026. O lab2 ficou de fora do cálculo: a coleta pegou só 46% das
# máquinas e a interseção seria enganosa.
#
# Cada laboratório acrescenta o que tem a mais em estado_pacotes_extra,
# no seu group_vars/<lab>.yml. A role estado_lab soma as duas listas.
#
# Alterar aqui vale para os cinco laboratórios — confira antes.
# ── ARGUMENTOS DE INSTALAÇÃO POR PACOTE ──────────────────────────────────
#
# Pacote -> argumentos passados ao INSTALADOR (não ao Chocolatey).
#
# Serve para os programas que, por padrão, instalam no perfil de quem
# executa. Como o Ansible conecta como 'suporte', eles ficariam invisíveis
# para o 'aluno', que é quem usa a máquina. Não há variável de ambiente que
# resolva isso: o instalador resolve o perfil pelo token de segurança.
#
# Vale para todos os laboratórios. Para argumentos específicos de um lab,
# defina estado_pacotes_args em group_vars/<lab>.yml — mas atenção, a
# variável é substituída inteira, não mesclada; repita as entradas comuns.
# Papel de parede padrão das estações — logo do SMD sobre fundo ardósia.
#
# A imagem vive no Samba, em windows_instaladores/, e chega às estações pelo
# espelho HTTP do controlador (repo_local.yml). Não é versionada aqui: o
# .gitignore bloqueia *.jpg, e com razão, sendo o repositório público.
#
# Antes desta mudança nenhum playbook copiava o arquivo — todos assumiam que
# já estava na máquina. Onde não estivesse, o registro apontava para o nada e
# a área de trabalho ficava no padrão do Windows, sem aviso. Era a segunda
# causa da falta de uniformidade; a primeira era a escrita ir para o perfil
# do 'suporte' em vez do 'aluno'.
estado_wallpaper_arquivo: 'wallpapersmd.jpg'
estado_wallpaper: 'C:\Windows\Web\Wallpaper\Windows\wallpapersmd.jpg'

# ── PACOTES MANTIDOS SEMPRE NA ÚLTIMA VERSÃO ─────────────────────────────
#
# O padrão do parque é 'present': garante presença e não mexe na versão,
# para que uma turma não encontre software diferente do da aula anterior.
#
# Navegador é a exceção, e por um motivo concreto: ele se atualiza sozinho e,
# quando não consegue, PEDE ELEVAÇÃO. No lab4, em 10/09/2026, o Firefox
# passou a exibir na inicialização um diálogo pedindo a senha do 'suporte' —
# a um aluno, que não a tem e não deve ter.
#
# Manter em 'latest' não abre mão de reprodutibilidade: transfere a
# atualização do navegador de cada estação, por conta própria e em momentos
# diferentes, para o Ansible, que a faz em todas de uma vez.
#
# CONSEQUÊNCIA NA AUDITORIA: a cada versão nova do Firefox, o --check semanal
# vai apontar divergência nas máquinas ainda não atualizadas. É ruído útil —
# significa "há atualização pendente", e some com um estado.yml.
estado_pacotes_latest:
  - firefox

# O Chrome NÃO entra na lista: nas 155 máquinas ele foi instalado por .exe,
# não pelo Chocolatey (aparece na seção 4 dos relatórios, registro do
# Windows), e se atualiza pelo serviço do Google Update, que roda como
# SYSTEM e não pede elevação a ninguém. Declará-lo aqui não teria efeito
# sobre a instalação existente — ver a nota em group_vars/lab1.yml.

estado_pacotes_args:
  # Arduino IDE 2.x: sem isto vai para %LOCALAPPDATA%\Programs\Arduino IDE
  # do usuário que instalou. Com /ALLUSERS vai para %PROGRAMFILES%.
  # /S é o modo silencioso do instalador NSIS.
  arduino: '/ALLUSERS /S'

estado_pacotes_base:
  - audacity
  - foxitreader
  - gimp
  - git
  - inkscape
  - krita
  - libreoffice-fresh
  - nodejs
  - openjdk
  - python              # metapacote: aponta para o python3 mais recente
  - reaper
  - tightvnc
  - vscode
  - winrar
