---
# Estado desejado do laboratório 2.
#
# O núcleo comum aos cinco labs Windows está em group_vars/windows.yml
# (estado_pacotes_base, 14 pacotes). Aqui vai só o que o lab2 tem a mais.
#
# Derivado de inventario/software-lab2.txt (01/09/2026), 93% de cobertura —
# 26 de 28 máquinas. Ficaram de fora a 213, em manutenção, e a 225, fora da
# rede.
#
# ATENÇÃO — O LAB2 NÃO TINHA O NÚCLEO COMPLETO
# Cinco pacotes do núcleo — inkscape, openjdk, reaper, vscode e winrar —
# existiam apenas em parte das máquinas. Ao aplicar o estado.yml eles serão
# INSTALADOS onde faltam. É o efeito pretendido: uniformizar. Mas vale saber
# que a primeira convergência aqui mexe em mais coisa que nos outros labs.
#
# Hardware: o mais modesto do parque. Dell OptiPlex 780 e Lenovo antigos,
# classificados na faixa de desempenho mais baixa da planilha de inventário.
# Por isso nada de modelagem 3D ou motores de jogo.
#
# ── REVISÃO DE 03/09/2026: QUATRO REMOÇÕES ───────────────────────────────
# A lista original foi derivada de um relatório que ainda não trazia CONTAGEM.
# Sem ela, "presente no laboratório" e "presente numa máquina do laboratório"
# eram indistinguíveis, e nove dos dezessete extras existiam em 1 a 4 das 26
# estações — resíduo de instalação manual, promovido a padrão por engano.
#
# Quem revelou isso foi a própria auditoria: ela acusou 25 máquinas fora do
# estado e a 224 dentro dele. A inversão era a pista. A 224 é a estação
# reinstalada à mão de onde metade desses pacotes tinha sido lida.
#
# Saíram: anaconda3, eclipse, powerbi (os três só na 224) e androidstudio
# (só na 217). Ficaram netbeans, asio4all e processing, que estavam só na
# 243 mas formam conjunto coerente e são usados em disciplina; e postman e
# wireshark, em quatro máquinas contíguas — bancada de redes.
#
# REMOVER DA LISTA NÃO DESINSTALA. O estado.yml já havia propagado os nove
# para as 26 antes desta revisão, e eles continuam lá. A mudança é que
# deixam de ser exigidos e de gerar alerta. Se quiser desinstalá-los de
# fato, é operação à parte e deliberada.

estado_pacotes_extra:
  # ── Navegadores ───────────────────────────────────────────────────
  - firefox

  # ── IDEs e editores ───────────────────────────────────────────────
  - pycharm-community
  - netbeans
  - notepadplusplus

  # REMOVIDO 03/09/2026 — estava só na 217, sem conjunto que o justificasse,
  # e pesa vários GB em cada uma das 26 estações.
  #  - androidstudio

  # DECLARADO EM 08/09/2026, depois de ter sido removido em 03/09.
  #
  # A remoção partiu de um relatório que o mostrava só na 224. Só que o
  # estado.yml já o havia propagado para as 25 antes disso — a remoção da
  # lista não desinstala, então ele ficou em todas e voltou no relatório de
  # 08/09 na seção 2, "em todas, mas não declarado".
  #
  # Diante do fato consumado, declarar é o certo: é o que já existe, e
  # deixá-lo fora manteria a seção 2 sugerindo-o para sempre.
  #
  # A 224 tem também 'eclipse-java-oxygen', versão de 2017, que ninguém
  # mais tem. Esse continua fora da lista.
  - eclipse

  # ── Desenvolvimento ───────────────────────────────────────────────
  - bitvise-ssh-client
  - postman
  - autohotkey.portable

  # ATENÇÃO — DISPERSÃO DE PYTHON, PIOR QUE NOS OUTROS LABS
  # O inventário achou 'python', 'python3' e 'python314' em TODAS as 26
  # máquinas, mais 'python313' em algumas. São quatro entradas para a mesma
  # linguagem. O núcleo já declara 'python', que é metapacote apontando para
  # o python3 mais recente — os demais vêm por dependência ou por instalação
  # manual antiga. Não declarei nenhum dos outros.
  #  - python3
  #  - python313
  #  - python314

  # ATENÇÃO — DOIS JDKs
  # O núcleo já traz 'openjdk'. O inventário achou também 'corretto21jdk' em
  # parte das máquinas. Mantive só o do núcleo.
  #  - corretto21jdk

  # REMOVIDO 03/09/2026 — estava só na 224. E não instalava: era o único
  # pacote que a auditoria continuava acusando como ausente em 25 máquinas
  # DEPOIS de o estado.yml ter rodado. A falha era invisível porque a tarefa
  # de instalação usa 'failed_when: false' e o relatório filtra por 'failed'.
  #  - anaconda3

  # REMOVIDO 03/09/2026 — estava só na 224, e havia o conflito já anotado: a
  # role maintenance instala o Power BI por outro caminho (tarefa 'powerbi',
  # com conta de usuário própria e senha do vault). Declarado aqui, o
  # Chocolatey instalaria uma segunda via, sem essa conta. A instalação
  # continua sendo pela role — mesmo caso do mysql no lab1.
  #  - powerbi

  # ── Design e áudio ────────────────────────────────────────────────
  - fontforge
  - asio4all          # driver de áudio de baixa latência, usado com o Reaper

  # ── Simulação e ensino ────────────────────────────────────────────
  - processing

  # ── Eletrônica ────────────────────────────────────────────────────
  - arduino

  # ── Rede ──────────────────────────────────────────────────────────
  - wireshark

  # ── Periféricos ───────────────────────────────────────────────────
  - wacom-drivers

  # NÃO DECLARADO — dependência, não escolha de configuração:
  #  - dotnet4.5.2   (runtime arrastado por outro pacote)

# ── ATENDIMENTOS PONTUAIS ────────────────────────────────────────────────
# Software instalado numa máquina a pedido, de propósito, para uma demanda
# específica. Não é padrão do laboratório e não é resíduo.
#
# Registrar aqui não instala nada: serve para o inventário parar de
# devolver esses pacotes como decisão em aberto a cada revisão. Eles saem
# da seção 3b e passam para a 3c, que apenas confere se continuam na
# máquina onde foram anotados.
#
# Os quatro removidos da lista declarada em 03/09/2026 — anaconda3,
# eclipse e powerbi na 224, androidstudio na 217 — são candidatos naturais
# a entrar aqui, SE tiverem sido atendimentos pontuais. Não registrei
# porque não sei: podem ter sido isso, ou resíduo de reinstalação, ou
# herança de imagem, como se verificou nas 633 e 634 do lab6. Quem esteve
# na intervenção sabe; preencha com o motivo e a data.
#
estado_pacotes_pontuais:
  - pacote: anaconda3
    posicoes: ['224']
    motivo: 'Instalação a pedido'
    data: 'Indeterminada'

  - pacote: eclipse-java-oxygen
    posicoes: ['224']
    motivo: >-
      Eclipse de 2017, presente só na 224 — nenhuma outra máquina tem. O
      'eclipse' atual passou a ser declarado em 08/09/2026; este continua
      pontual, e significa dois Eclipse nessa máquina.
    data: 'Indeterminada'

# ── TRÊS QUE DEIXARAM DE SER PONTUAIS (verificado em 08/09/2026) ─────────
#
# eclipse, powerbi e androidstudio estavam registrados aqui como instalação
# numa máquina só. O relatório de 08/09 os encontrou nas 25: entre a decisão
# de removê-los da lista declarada (03/09) e este registro, o estado.yml já
# os havia instalado no laboratório inteiro — e remover da lista não
# desinstala. O registro descrevia um estado que tinha deixado de existir.
#
#   eclipse        → promovido a declarado, na seção de IDEs acima.
#   powerbi        → segue nas 25, fora da lista por decisão. A instalação
#                    padrão é pela role maintenance, com conta de usuário
#                    própria; pelo Chocolatey viria uma segunda via sem ela.
#   androidstudio  → segue nas 25, fora da lista. REMOÇÃO ADIADA para a
#                    virada do semestre letivo, ou antes se fizer falta o
#                    espaço em disco. Decisão de 08/09/2026.
#
#                    Como chegou aqui: veio num HD remanejado que não foi
#                    plataformado. Uma máquina passou a tê-lo, o inventário
#                    o leu como padrão do laboratório — o relatório ainda
#                    não tinha contagem, então "numa máquina" e "no
#                    laboratório" eram indistinguíveis — ele entrou na lista
#                    declarada e o estado.yml o propagou para as 25.
#
#                    Por que sai: o mapa de salas de 2026.2 mostra que
#                    nenhuma disciplina do lab2 o requer (Autoração
#                    Multimídia II, Design de Interfaces Gráficas,
#                    Programação II, Computação Física, Estrutura de Dados,
#                    IHC I, PPGTE Tecnologias Emergentes). Programação para
#                    Dispositivos Móveis é no lab4, onde ele já é declarado.
#                    E o hardware daqui — OptiPlex 780, CPU Mark 2290, 4 GB
#                    — fica abaixo do mínimo do produto: não é só supérfluo,
#                    é inutilizável.
#
#                    Quando for a hora:
#                      ansible-playbook remover_pacote.yml -e alvo=lab2 \
#                        -e pacote=androidstudio -t remover
#
# Consequência a conhecer: powerbi e androidstudio vão aparecer na seção 2
# do inventário ("em todas, mas não declarado") em toda revisão, e não há
# como silenciá-los — o registro de pontuais filtra a seção 3, não a 2. As
# saídas seriam declará-los ou desinstalá-los. Conviver com o aviso é
# escolha legítima, desde que consciente.

# 'present' garante presença sem atualizar a cada execução.
estado_pacotes_versao: present

estado_plano_energia: 'Equilibrado'
estado_desligar_hora: '23:00'
estado_autologon_usuario: aluno
