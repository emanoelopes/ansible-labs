# Group variables for macOS hosts
# O segredo fica em group_vars/macos/vault.yml, cifrado com Ansible Vault.
# Esse arquivo está no .gitignore (padrão group_vars/*/vault.yml, igual
# group_vars/all/vault.yml) — só existe localmente. Modelo em vault.yml.example.
#
# Ativado em 11/09/2026: grupo [macos:children] criado em inventory.ini
# (lab3), ansible_user preenchido.
#
# Antes disso o segredo vivia em group_vars/macos_vault.yml — um arquivo
# solto que NUNCA era carregado, com ou sem [macos:children]: Ansible só lê
# group_vars/<grupo>.yml ou group_vars/<grupo>/*.yml, e "macos_vault" não é
# nome de grupo nenhum. Fica como nota para não reincidir: variável de vault
# de grupo vai dentro de uma pasta group_vars/<grupo>/, nunca num arquivo
# group_vars/<grupo>_vault.yml.
#
# Testar com um host só antes do laboratório inteiro:
#   ansible -m ping lab3 --limit 311
#
# A migração do lab3 para o modelo de estado declarado (equivalente ao
# estado_lab dos labs Windows, usando Homebrew) ficou para um próximo ciclo.

ansible_user: suporte

# ── Papel de parede ──────────────────────────────────────────────────────
#
# Mesma imagem dos laboratórios Windows, vinda do mesmo espelho HTTP. O
# caminho de destino é outro porque o macOS não tem C:\Windows\Web.
#
# /Library/Desktop Pictures é o diretório do sistema para isso: legível por
# todos os usuários, e é onde o próprio macOS guarda as imagens padrão.
estado_wallpaper_arquivo: 'wallpapersmd.jpg'
estado_wallpaper_macos: '/Library/Desktop Pictures/wallpapersmd.jpg'

# Use the same secret for SSH and sudo to avoid -k and -K prompts
ansible_password: "{{ vault_macos_password }}"
ansible_become_password: "{{ vault_macos_password }}"

# Connection settings (optional; adjust as needed)
ansible_become: true
ansible_become_method: sudo
ansible_connection: ssh

