---
# Estado desejado do laboratório 1.
#
# O núcleo comum aos cinco labs Windows está em group_vars/windows.yml
# (estado_pacotes_base, 14 pacotes). Aqui vai só o que o lab1 tem a mais.
#
# Lista revisada em 24/08/2026 a partir de inventario/software-lab1.txt,
# com 96% de cobertura (25 de 26 máquinas).
#
# O MySQL ficou de fora de propósito — continua sendo instalado pela role smd,
# que passa a senha de root via package_params.
#
#   auditar:  ansible-playbook estado.yml -e alvo=lab1 --check --diff
#   piloto:   ansible-playbook estado.yml -e alvo=lab1 --limit 112
#   aplicar:  ansible-playbook estado.yml -e alvo=lab1

estado_pacotes_extra:
  # ── Exclusivos do lab1: dependem do hardware ──────────────────────
  # O lab1 tem Dell Inspiron 5400 AIO (CPU Mark 10548), contra 4664 do
  # OptiPlex 7010 do lab4. Modelagem 3D, motores de jogo e renderização
  # só rodam bem aqui — por isso não estão no núcleo.
  - blender
  - unity-hub
  - godot
  - epicgameslauncher
  - processing

  # ── Navegadores ───────────────────────────────────────────────────
  - firefox

  # REMOVIDO 04/09/2026 — o Chrome NÃO é gerenciado pelo Chocolatey aqui.
  #
  # Ele está instalado nas 26 máquinas do lab1 e nas dos outros quatro labs,
  # mas pelo instalador .exe: aparece na seção 4 dos relatórios (registro do
  # Windows, em todas), não na seção do Chocolatey. O Chocolatey não enxerga
  # essa instalação, então declarar 'googlechrome' faz o Ansible querer pôr
  # uma segunda via em 25 máquinas — em toda execução, para sempre.
  #
  # A 147 era a única "conforme" na auditoria de 04/09/2026 justamente por
  # ser a única onde o Chrome veio pelo Chocolatey. A inversão denunciou o
  # problema, como no lab2.
  #
  # O Chrome se atualiza sozinho e nenhum dos outros labs o declara. Se algum
  # dia se quiser trazê-lo para o Chocolatey, é migração deliberada — instalar
  # por cima em 25 estações — e não algo que a lista de estado deva provocar
  # por acidente.
  #  - googlechrome

  # ── IDEs e editores ───────────────────────────────────────────────
  - pycharm-community
  - netbeans
  - notepadplusplus
  - androidstudio

  # ── Desenvolvimento ───────────────────────────────────────────────
  - github-desktop
  - postman
  - bitvise-ssh-client
  - autohotkey.portable

  # ── Estatística ───────────────────────────────────────────────────
  - r.project
  - r.studio

  # ── Design e áudio ────────────────────────────────────────────────
  - fontforge
  - asio4all          # driver de áudio de baixa latência, usado com o Reaper

  # ── Eletrônica ────────────────────────────────────────────────────
  # MANTIDO POR DECISÃO — revisado em 08/09/2026.
  #
  # É o único extra do lab1 sem disciplina que o justifique: o mapa de
  # salas 2026.2 aloca Computação Física no lab2, não aqui. As demais do
  # lab1 são Inteligência Computacional Aplicada a Jogos I, Ferramentas de
  # Modelagem Tridimensional I, Oficina de Podcast, Comunicação Visual I,
  # Sistemas Distribuídos, Linguagem de Programação Script e duas do PPGTE.
  #
  # Fica mesmo assim: é leve, não pesa no disco, e ter disponível cobre
  # demanda eventual sem exigir intervenção. O critério aqui é custo de
  # manter contra custo de instalar às pressas — diferente do androidstudio
  # no lab2, que somava vários GB a máquinas que sequer o executam.
  #
  # Não reabrir sem motivo novo.
  - arduino

  # ── Rede ──────────────────────────────────────────────────────────
  - wireshark

  # ── Periféricos ───────────────────────────────────────────────────
  - wacom-drivers

# 'present' garante presença sem atualizar a cada execução. Trocar para
# ── O QUE A SEÇÃO 3b DEVOLVEU EM 08/09/2026 ──────────────────────────────
# Registrado aqui para o relatório parar de perguntar. Nenhum dos três deve
# ser declarado, e por motivos diferentes.
estado_pacotes_pontuais:
  # A 147 é a ÚNICA máquina do lab1 onde o Chrome veio pelo Chocolatey. Nas
  # outras 25 ele está instalado pelo .exe e aparece na seção 4 do
  # relatório, registro do Windows. Foi essa inversão — a máquina fora do
  # padrão sendo a única "conforme" — que denunciou o erro de declarar
  # 'googlechrome' aqui, corrigido em 04/09/2026.
  #
  # NÃO DECLARAR: o Chocolatey não enxerga a instalação por .exe, e exigi-lo
  # poria uma segunda via em 25 máquinas, em toda execução.
  - pacote: googlechrome
    posicoes: ['147']
    motivo: 'Única máquina com Chrome via Chocolatey; nas demais é instalação .exe'
    data: '2026-09-04'

  # Instalados pela role smd, não pelo estado declarado: ela usa
  # package_params '/Password:{{ vault_senha_mysql_root }}' para definir a
  # senha de root. A 111 foi a máquina piloto do trabalho de agosto/2026.
  #
  # NÃO DECLARAR: pelo Chocolatey viria sem o parâmetro de senha, e o banco
  # ficaria com credencial diferente da que a role configura. É o mesmo
  # caso do powerbi no lab2.
  - pacote: mysql
    posicoes: ['147']
    motivo: 'Instalado pela role smd, com senha de root via package_params'
    data: 'Indeterminada'

  - pacote: mysql.workbench
    posicoes: ['111', '147']
    motivo: 'Instalado pela role smd junto com o mysql; a 111 foi a máquina piloto'
    data: 'Indeterminada'

# 'latest' quando houver janela para atualizações não supervisionadas.
estado_pacotes_versao: present

estado_plano_energia: 'Equilibrado'
estado_desligar_hora: '23:00'
estado_autologon_usuario: aluno
