---
# Auditoria diária de desvio de configuração.
#
# Roda o estado.yml em modo --check (não altera nada), compara o resultado com
# o estado declarado em group_vars/<lab>.yml e envia por e-mail apenas o que
# divergiu. É a etapa 4 do relatório: execução sem operador.
#
#   manual:     ansible-playbook auditoria.yml -e alvo=lab1
#   sem e-mail: ansible-playbook auditoria.yml -e alvo=lab1 -e enviar_email=false
#   instalar o agendamento diário:
#               ansible-playbook auditoria.yml -t instalar_agendamento
#
# Por que rodar o ansible-playbook de dentro de um playbook: o modo --check
# precisa valer para as estações mas NÃO para o envio do e-mail, que é uma ação
# real. Separando em dois processos, o relatório sai de um e a notificação do
# outro, e a senha do SMTP continua vindo do vault como todo o resto.

- name: Auditoria de desvio
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    alvo: lab1
    enviar_email: true
    destinatario: 'emanoel@virtual.ufc.br'
    relatorio_json: "{{ inventario_dir }}/auditoria-{{ alvo }}.json"
    relatorio_txt: "{{ inventario_dir }}/auditoria-{{ alvo }}.txt"

    # Gmail / Google Workspace. A senha é uma "app password", não a senha da
    # conta — contas com verificação em duas etapas exigem isso.
    smtp_host: 'smtp.gmail.com'
    smtp_porta: 587
    smtp_usuario: 'emanoel@virtual.ufc.br'

  tasks:
    - name: Garantir o diretório de relatórios
      ansible.builtin.file:
        path: "{{ inventario_dir }}"
        state: directory
        mode: "0750"

    - name: Executar a verificação de desvio (--check, não altera nada)
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - "{{ playbook_dir }}/estado.yml"
          - -e
          - "alvo={{ alvo }}"
          # Sem escalonamento: em --check nada é alterado, e as levas do
          # serial apenas multiplicariam o tempo de espera.
          - -e
          - "estado_serial=100%"
          - --check
      environment:
        ANSIBLE_STDOUT_CALLBACK: json
        ANSIBLE_CALLBACKS_ENABLED: json
        ANSIBLE_LOAD_CALLBACK_PLUGINS: 'true'
        # O padrão de 10 em ansible.cfg serve para aplicar mudanças com
        # cautela. Numa verificação que não altera nada, paralelizar mais é
        # seguro e corta o tempo proporcionalmente.
        ANSIBLE_FORKS: '30'
      register: verificacao
      changed_when: false
      failed_when: false

    - name: Salvar a saída bruta
      ansible.builtin.copy:
        content: "{{ verificacao.stdout }}"
        dest: "{{ relatorio_json }}"
        mode: "0640"

    - name: Interpretar o resultado
      ansible.builtin.set_fact:
        resultado: "{{ verificacao.stdout | from_json }}"
      failed_when: false

    # Usa o bloco 'stats' do callback json, que já traz um resumo por host.
    # Evita o filtro json_query, que dependeria do pacote jmespath instalado no
    # controlador — uma dependência a mais para uma tarefa agendada quebrar.
    - name: Montar as listas de divergência
      ansible.builtin.set_fact:
        divergencias: >-
          {{ resultado.stats | dict2items
             | selectattr('value.changed', 'gt', 0)
             | map(attribute='key') | list }}
        inalcancaveis: >-
          {{ resultado.stats | dict2items
             | selectattr('value.unreachable', 'gt', 0)
             | map(attribute='key') | list }}
        com_falha: >-
          {{ resultado.stats | dict2items
             | selectattr('value.failures', 'gt', 0)
             | map(attribute='key') | list }}
      when: resultado is defined

    # Máquinas desligadas NÃO são desvio de configuração. Neste parque elas são
    # ligadas sob demanda, então tratá-las como problema geraria alerta em toda
    # execução — e um alerta que sempre dispara deixa de ser lido. Elas entram
    # como informação de cobertura, e não contam para o envio do e-mail.
    # Em tarefa separada de propósito: chaves definidas num mesmo set_fact não
    # enxergam umas às outras — todas são resolvidas a partir do contexto
    # anterior à tarefa. 'corpo' usa 'avaliadas', então precisa vir depois.
    - name: Calcular quantas máquinas foram avaliadas
      ansible.builtin.set_fact:
        avaliadas: >-
          {{ (resultado.stats | default({}) | length) - (inalcancaveis | default([]) | length) }}

    - name: Compor o relatório
      ansible.builtin.set_fact:
        corpo: |
          Auditoria de desvio — {{ alvo }}
          {{ ansible_date_time.date }} {{ ansible_date_time.time }}

          Máquinas avaliadas: {{ avaliadas }} de {{ resultado.stats | default({}) | length }}
          {% if inalcancaveis | default([]) | length > 0 %}
          Não avaliadas (desligadas): {{ inalcancaveis | length }} — {{ inalcancaveis | join(', ') }}
          {% endif %}

          ── FORA DO ESTADO DECLARADO: {{ divergencias | default([]) | length }} ──
          {% for h in divergencias | default([]) %}
            {{ h }}
          {% else %}
            (nenhuma)
          {% endfor %}

          ── ERRO NA VERIFICAÇÃO: {{ com_falha | default([]) | length }} ──
          {% for h in com_falha | default([]) %}
            {{ h }}
          {% else %}
            (nenhuma)
          {% endfor %}

          {% if (divergencias | default([]) | length == 0)
                and (com_falha | default([]) | length == 0) %}
          Nada a corrigir nas máquinas avaliadas.
          {% else %}
          Detalhamento por tarefa em {{ relatorio_json }}.

          Para corrigir:
            ansible-playbook estado.yml -e alvo={{ alvo }}
          {% endif %}

          Máquinas desligadas não são avaliadas e não geram alerta. Elas serão
          verificadas na próxima execução em que estiverem ligadas.

    - name: Salvar o relatório legível
      ansible.builtin.copy:
        content: "{{ corpo }}"
        dest: "{{ relatorio_txt }}"
        mode: "0640"

    - name: Mostrar o relatório
      ansible.builtin.debug:
        msg: "{{ corpo.split('\n') }}"

    # Só notifica quando há o que notificar. Um e-mail diário dizendo "está
    # tudo bem" vira ruído e deixa de ser lido em duas semanas.
    - name: Enviar e-mail se houver divergência
      community.general.mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_porta }}"
        username: "{{ smtp_usuario }}"
        password: "{{ vault_senha_smtp }}"
        to: "{{ destinatario }}"
        subject: "[ansible-labs] {{ alvo }}: {{ divergencias | default([]) | length }} máquina(s) fora do estado"
        body: "{{ corpo }}"
        secure: starttls
      # Máquina desligada não entra na condição: é situação normal aqui.
      when:
        - enviar_email | bool
        - (divergencias | default([]) | length > 0)
          or (com_falha | default([]) | length > 0)
      no_log: true

- name: Instalar o agendamento semanal
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [never, instalar_agendamento]

  vars:
    # Laboratórios auditados pelo agendamento. Acrescente conforme forem
    # ganhando group_vars declarado.
    #
    # Os cinco desde 01/09/2026. O lab5 é o mais importante da lista: passou
    # tempo indeterminado inacessível por erro de transporte no inventário,
    # divergindo em silêncio, e ninguém percebeu — é o caso que justificou
    # esta auditoria existir.
    auditoria_alvos: ['lab1', 'lab2', 'lab4', 'lab5', 'lab6']

  pre_tasks:
    # O serviço do systemd NÃO herda o ambiente do seu shell. Sem estas
    # verificações, a primeira execução agendada falharia por falta da senha
    # do vault — e falharia em silêncio, já que ninguém está olhando às 14h
    # de quarta. Melhor descobrir agora, na instalação.
    - name: Confirmar que o arquivo de senha do vault existe
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.ansible_vault_pass"
      register: vault_pass_file

    - name: Abortar se o arquivo de senha do vault não existir
      ansible.builtin.fail:
        msg: >-
          {{ ansible_env.HOME }}/.ansible_vault_pass não existe. O serviço
          agendado precisa dele para abrir o vault, e não herda a variável
          ANSIBLE_VAULT_PASSWORD_FILE do seu shell.
      when: not vault_pass_file.stat.exists

    - name: Confirmar que a senha do SMTP está no vault
      ansible.builtin.assert:
        that:
          - vault_senha_smtp is defined
          - vault_senha_smtp != 'TROCAR'
        fail_msg: >-
          vault_senha_smtp não está preenchida. Sem ela a auditoria roda mas
          não consegue enviar o relatório — e você não seria avisado disso.
          Use: ansible-vault edit group_vars/all/vault.yml
        quiet: true

  tasks:
    - name: Criar a unidade de serviço
      ansible.builtin.copy:
        dest: /etc/systemd/system/ansible-auditoria.service
        mode: "0644"
        content: |
          [Unit]
          Description=Auditoria de desvio dos laboratórios (ansible-labs)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User={{ ansible_user_id }}
          WorkingDirectory={{ playbook_dir }}

          # Sem esta linha o serviço não abre o vault: systemd não herda o
          # ambiente do shell de quem instalou.
          Environment=ANSIBLE_VAULT_PASSWORD_FILE={{ ansible_env.HOME }}/.ansible_vault_pass

          # Um ExecStart por laboratório. Type=oneshot os executa em sequência
          # e considera o serviço com falha se qualquer um falhar.
          {% for lab in auditoria_alvos %}
          ExecStart=/usr/bin/ansible-playbook {{ playbook_dir }}/auditoria.yml -e alvo={{ lab }}
          {% endfor %}
      become: true

    # Semanal, e não diária, e no meio da tarde: as estações são ligadas sob
    # demanda, então às 6h quase nenhuma responderia e a auditoria avaliaria
    # um punhado de máquinas. Quarta à tarde tende a pegar o laboratório em
    # uso, o que dá cobertura útil.
    #
    # Para mudar o dia ou a hora, edite OnCalendar e rode de novo:
    #   Mon Tue Wed Thu Fri Sat Sun  |  formato: DIA *-*-* HH:MM:SS
    - name: Criar o timer semanal
      ansible.builtin.copy:
        dest: /etc/systemd/system/ansible-auditoria.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Auditoria semanal de desvio dos laboratórios

          [Timer]
          OnCalendar=Wed *-*-* 14:00:00
          Persistent=true
          RandomizedDelaySec=600

          [Install]
          WantedBy=timers.target
      become: true

    - name: Ativar o timer
      ansible.builtin.systemd_service:
        name: ansible-auditoria.timer
        enabled: true
        state: started
        daemon_reload: true
      become: true

    # Uma execução de verdade agora, pelo systemd, com o ambiente que ele
    # usará de fato. É a única forma de saber se a senha do vault e o envio
    # de e-mail funcionam no contexto do serviço — testar pelo shell não
    # prova nada, porque o shell tem variáveis que o systemd não tem.
    # --no-block é obrigatório. Sem ele, 'systemctl start' de um serviço
    # Type=oneshot BLOQUEIA até o serviço terminar — a auditoria dos cinco
    # laboratórios inteiros, com timeout de WinRM em cada máquina desligada.
    # Na instalação de 01/09/2026 isso deixou o playbook mudo por mais de
    # vinte minutos, e a tarefa de espera abaixo virou código morto, porque
    # só começava depois que o serviço já havia acabado.
    - name: Executar uma vez para validar o contexto do serviço
      ansible.builtin.command: systemctl start --no-block ansible-auditoria.service
      become: true
      changed_when: true

    - name: Aguardar a conclusão
      ansible.builtin.command: systemctl is-active ansible-auditoria.service
      register: exec_estado
      until: exec_estado.stdout | trim != 'activating'
      # Cerca de 10 minutos por laboratório: cada um percorre ~30 máquinas e
      # gasta o timeout de WinRM nas que estiverem desligadas. Um valor fixo
      # expirava antes do fim assim que a lista passou de um lab.
      retries: "{{ auditoria_alvos | length * 40 }}"
      delay: 15
      changed_when: false
      failed_when: false
      become: true

    - name: Ler o resultado da execução
      ansible.builtin.command: systemctl show ansible-auditoria.service -p Result --value
      register: exec_resultado
      changed_when: false
      become: true

    - name: Confirmar
      ansible.builtin.debug:
        msg: |
          Timer instalado e validado.

          Execução de teste: {{ exec_resultado.stdout | trim }}
          {% if exec_resultado.stdout | trim != 'success' %}

          ATENÇÃO — a execução pelo systemd falhou. Ver o motivo com:
            journalctl -u ansible-auditoria.service -n 50 --no-pager

          O timer está ativo, mas vai falhar toda quarta até isso ser
          resolvido.
          {% else %}
          Próxima execução automática:
            systemctl list-timers ansible-auditoria.timer
          {% endif %}
