---
# Auditoria diária de desvio de configuração.
#
# Roda o estado.yml em modo --check (não altera nada), compara o resultado com
# o estado declarado em group_vars/<lab>.yml e envia por e-mail apenas o que
# divergiu. É a etapa 4 do relatório: execução sem operador.
#
#   manual:     ansible-playbook auditoria.yml -e alvo=lab1
#   sem e-mail: ansible-playbook auditoria.yml -e alvo=lab1 -e enviar_email=false
#   instalar o agendamento diário:
#               ansible-playbook auditoria.yml -t instalar_agendamento
#
# Por que rodar o ansible-playbook de dentro de um playbook: o modo --check
# precisa valer para as estações mas NÃO para o envio do e-mail, que é uma ação
# real. Separando em dois processos, o relatório sai de um e a notificação do
# outro, e a senha do SMTP continua vindo do vault como todo o resto.

- name: Auditoria de desvio
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    alvo: lab1
    enviar_email: true
    destinatario: 'emanoel@virtual.ufc.br'
    relatorio_json: "{{ inventario_dir }}/auditoria-{{ alvo }}.json"
    relatorio_txt: "{{ inventario_dir }}/auditoria-{{ alvo }}.txt"

    # Gmail / Google Workspace. A senha é uma "app password", não a senha da
    # conta — contas com verificação em duas etapas exigem isso.
    smtp_host: 'smtp.gmail.com'
    smtp_porta: 587
    smtp_usuario: 'emanoel@virtual.ufc.br'

  tasks:
    - name: Garantir o diretório de relatórios
      ansible.builtin.file:
        path: "{{ inventario_dir }}"
        state: directory
        mode: "0750"

    - name: Executar a verificação de desvio (--check, não altera nada)
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - "{{ playbook_dir }}/estado.yml"
          - -e
          - "alvo={{ alvo }}"
          # Sem escalonamento: em --check nada é alterado, e as levas do
          # serial apenas multiplicariam o tempo de espera.
          - -e
          - "estado_serial=100%"
          - --check
      environment:
        ANSIBLE_STDOUT_CALLBACK: json
        ANSIBLE_CALLBACKS_ENABLED: json
        ANSIBLE_LOAD_CALLBACK_PLUGINS: 'true'
        # O padrão de 10 em ansible.cfg serve para aplicar mudanças com
        # cautela. Numa verificação que não altera nada, paralelizar mais é
        # seguro e corta o tempo proporcionalmente.
        ANSIBLE_FORKS: '30'
      register: verificacao
      changed_when: false
      failed_when: false

    - name: Salvar a saída bruta
      ansible.builtin.copy:
        content: "{{ verificacao.stdout }}"
        dest: "{{ relatorio_json }}"
        mode: "0640"

    - name: Interpretar o resultado
      ansible.builtin.set_fact:
        resultado: "{{ verificacao.stdout | from_json }}"
      failed_when: false

    # Usa o bloco 'stats' do callback json, que já traz um resumo por host.
    # Evita o filtro json_query, que dependeria do pacote jmespath instalado no
    # controlador — uma dependência a mais para uma tarefa agendada quebrar.
    - name: Montar as listas de divergência
      ansible.builtin.set_fact:
        divergencias: >-
          {{ resultado.stats | dict2items
             | selectattr('value.changed', 'gt', 0)
             | map(attribute='key') | list }}
        inalcancaveis: >-
          {{ resultado.stats | dict2items
             | selectattr('value.unreachable', 'gt', 0)
             | map(attribute='key') | list }}
        com_falha: >-
          {{ resultado.stats | dict2items
             | selectattr('value.failures', 'gt', 0)
             | map(attribute='key') | list }}
      when: resultado is defined

    # Máquinas desligadas NÃO são desvio de configuração. Neste parque elas são
    # ligadas sob demanda, então tratá-las como problema geraria alerta em toda
    # execução — e um alerta que sempre dispara deixa de ser lido. Elas entram
    # como informação de cobertura, e não contam para o envio do e-mail.
    # Em tarefa separada de propósito: chaves definidas num mesmo set_fact não
    # enxergam umas às outras — todas são resolvidas a partir do contexto
    # anterior à tarefa. 'corpo' usa 'avaliadas', então precisa vir depois.
    - name: Calcular quantas máquinas foram avaliadas
      ansible.builtin.set_fact:
        avaliadas: >-
          {{ (resultado.stats | default({}) | length) - (inalcancaveis | default([]) | length) }}

    - name: Compor o relatório
      ansible.builtin.set_fact:
        corpo: |
          Auditoria de desvio — {{ alvo }}
          {{ ansible_date_time.date }} {{ ansible_date_time.time }}

          {% set total = resultado.stats | default({}) | length %}
          {% set cobertura = ((avaliadas | int) * 100 / total) | round | int if total > 0 else 0 %}
          Máquinas avaliadas: {{ avaliadas }} de {{ total }} ({{ cobertura }}%)
          {% if inalcancaveis | default([]) | length > 0 %}
          Não avaliadas (desligadas): {{ inalcancaveis | length }} — {{ inalcancaveis | join(', ') }}
          {% endif %}
          {#
            Cobertura baixa é o modo de falha SILENCIOSO desta auditoria: ela
            roda, não encontra ninguém, e reporta "0 divergências" — que lido
            de relance parece boa notícia.

            O horário de cada laboratório foi escolhido a partir do Mapa de
            Salas, para cair dentro de uma aula. Quando o semestre vira, o
            mapa é refeito e as disciplinas trocam de sala; o agendamento
            continua rodando no horário velho, agora vazio. Nada dá erro.

            Por isso o aviso aparece no corpo do relatório e não só nos
            números: quem lê precisa saber que a ausência de divergência,
            aqui, não significa que está tudo certo.
          #}
          {% if cobertura < 50 %}

          ── ATENÇÃO: COBERTURA DE {{ cobertura }}% ────────────────────────
          Só {{ avaliadas }} de {{ total }} máquinas responderam. Com tão
          poucas avaliadas, "nenhuma divergência" abaixo não quer dizer que o
          laboratório esteja conforme — quer dizer que quase ninguém foi
          verificado.

          A causa mais provável é o AGENDAMENTO TER CADUCADO. O horário desta
          auditoria foi escolhido para coincidir com uma aula, segundo o Mapa
          de Salas do semestre. Se as disciplinas mudaram de laboratório, ele
          agora roda com a sala vazia.

          Confira o Mapa de Salas do semestre corrente e ajuste
          'auditoria_agenda' em auditoria.yml, depois:
            ansible-playbook auditoria.yml -t instalar_agendamento -K

          Se o horário ainda tem aula, então é outra coisa: máquinas
          desligadas por corte de energia no fim de semana não voltam nem por
          Wake-on-LAN. Verifique com:
            ansible-playbook alcance.yml -e alvo={{ alvo }}
          {% endif %}

          ── FORA DO ESTADO DECLARADO: {{ divergencias | default([]) | length }} ──
          {% for h in divergencias | default([]) %}
            {{ h }}
          {% else %}
            (nenhuma)
          {% endfor %}

          ── ERRO NA VERIFICAÇÃO: {{ com_falha | default([]) | length }} ──
          {% for h in com_falha | default([]) %}
            {{ h }}
          {% else %}
            (nenhuma)
          {% endfor %}

          {% if (divergencias | default([]) | length == 0)
                and (com_falha | default([]) | length == 0) %}
          Nada a corrigir nas máquinas avaliadas.
          {% else %}
          Detalhamento por tarefa em {{ relatorio_json }}.

          Para corrigir:
            ansible-playbook estado.yml -e alvo={{ alvo }}
          {% endif %}

          Máquinas desligadas não são avaliadas e não geram alerta. Elas serão
          verificadas na próxima execução em que estiverem ligadas.

    - name: Salvar o relatório legível
      ansible.builtin.copy:
        content: "{{ corpo }}"
        dest: "{{ relatorio_txt }}"
        mode: "0640"

    - name: Mostrar o relatório
      ansible.builtin.debug:
        msg: "{{ corpo.split('\n') }}"

    # Só notifica quando há o que notificar. Um e-mail diário dizendo "está
    # tudo bem" vira ruído e deixa de ser lido em duas semanas.
    - name: Enviar e-mail se houver divergência
      community.general.mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_porta }}"
        username: "{{ smtp_usuario }}"
        password: "{{ vault_senha_smtp }}"
        to: "{{ destinatario }}"
        subject: "[ansible-labs] {{ alvo }}: {{ divergencias | default([]) | length }} máquina(s) fora do estado"
        body: "{{ corpo }}"
        secure: starttls
      # Máquina desligada não entra na condição: é situação normal aqui.
      when:
        - enviar_email | bool
        - (divergencias | default([]) | length > 0)
          or (com_falha | default([]) | length > 0)
      no_log: true

- name: Instalar o agendamento semanal
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [never, instalar_agendamento]

  vars:
    # Laboratórios auditados pelo agendamento. Acrescente conforme forem
    # ganhando group_vars declarado.
    #
    # Os cinco Windows desde 01/09/2026. O lab5 é o mais importante da
    # lista: passou tempo indeterminado inacessível por erro de transporte
    # no inventário, divergindo em silêncio, e ninguém percebeu — é o caso
    # que justificou esta auditoria existir.
    #
    # lab3 (macOS) entrou em 11/09/2026, junto com roles/estado_lab_macos.
    # Ao contrário dos cinco Windows, a parte de energia dele (pmset) não
    # tem fidelidade de --check — só a seção de pacotes (Homebrew) é
    # auditada de verdade. Ver o cabeçalho de roles/estado_lab_macos/tasks.
    # ── QUANDO AUDITAR CADA LABORATÓRIO ──────────────────────────────────
    #
    # A auditoria só avalia quem está ligado. O agendamento anterior — todos
    # na quarta às 14h — era um palpite sobre quando haveria aula, e o
    # relatório de 09/09/2026 mostrou o preço do palpite:
    #
    #   lab5  23 de 25  tinha aula       lab1  4 de 27  SEM aula
    #   lab4  18 de 27  tinha aula       lab6  2 de 26  SEM aula
    #   lab2   6 de 26  tinha aula
    #
    # Os dois piores eram exatamente os dois sem aula no horário. Cobertura
    # total: 53 de 131.
    #
    # Agora cada laboratório é auditado numa janela em que o Mapa de Salas
    # registra aula. Não depende de Wake-on-LAN, de BIOS nem de ida ao
    # laboratório — e é imune ao corte de energia que derruba o WoL.
    #
    # ATENÇÃO: ISTO CADUCA A CADA SEMESTRE. O Mapa de Salas é refeito e as
    # disciplinas trocam de laboratório. Conferir na virada, com a skill
    # 'mapa-de-salas'. Um horário que ficou vazio NÃO dá erro: a auditoria
    # roda, encontra tudo desligado e reporta cobertura baixa — mesmo sintoma
    # silencioso de antes.
    #
    # Base: Mapa de Salas 2026.2, conferido em 14/09/2026.
    auditoria_agenda:
      - nome: 'terca'
        quando: 'Tue *-*-* 15:00:00'
        labs: ['lab2', 'lab6']
        motivo: 'Programação II; Análise e Projeto de Sistemas'

      # O lab1 fica sozinho porque não tem aula em nenhuma tarde de terça ou
      # quarta. Suas janelas são segunda 14-22h, quarta 8-12h, quinta 14-22h
      # e sexta 14-22h. A de quarta pela manhã mantém a auditoria concentrada
      # em dois dias.
      - nome: 'quarta-manha'
        quando: 'Wed *-*-* 10:00:00'
        labs: ['lab1']
        motivo: 'Inteligência Computacional Aplicada a Jogos I'

      - nome: 'quarta-tarde'
        quando: 'Wed *-*-* 15:00:00'
        labs: ['lab4', 'lab5']
        motivo: 'Prog. Dispositivos Móveis; Gestão de Projetos Multimídia'

    # ── O LAB3 NÃO ENTRA, E NÃO É ESQUECIMENTO ───────────────────────────
    #
    # Ele foi acrescentado aos alvos em algum momento e retirado em
    # 14/09/2026. A auditoria roda o estado.yml em --check, e o estado_lab é
    # inteiramente Chocolatey e WinRM. O lab3 são 24 iMacs por SSH, sem
    # estado declarado, e sem nem o grupo [macos:children] no inventário —
    # group_vars/macos.yml nunca é carregado e ansible_user lá ainda é
    # 'seu_usuario'.
    #
    # Incluí-lo produz 24 falhas por execução, toda semana, sem informação
    # nenhuma. Ele entra quando tiver o equivalente Homebrew do estado_lab —
    # ver as notas em inventory.ini e group_vars/macos.yml.
    auditoria_alvos: "{{ auditoria_agenda | map(attribute='labs') | flatten }}"

    # ── PRÓXIMO PASSO POSSÍVEL: ACORDAR ANTES DE AUDITAR ─────────────────
    #
    # A auditoria só avalia quem está ligado, e por isso o horário é quarta
    # às 14h — para pegar o laboratório em uso. É um palpite sobre quando há
    # aula, e a cobertura varia conforme o calendário.
    #
    # Desde 09/09/2026 o Wake-on-LAN funciona, enviando pelo ppgte-server:
    # no lab4, 23 de 27 estações desligadas acordaram. Isso permitiria
    # acrescentar ao ansible-auditoria.service, antes de cada laboratório:
    #
    #   ExecStartPre=/usr/bin/ansible-playbook {{ playbook_dir }}/acordar.yml -e alvo=<lab>
    #
    # e um desligar.yml ao final, para não deixar o parque aceso à toa.
    #
    # NÃO FOI FEITO AINDA, por decisão de 09/09/2026: observar algumas
    # execuções manuais primeiro. Automatizar o acordar significa o serviço
    # ligar 155 máquinas sozinho toda quarta — se algo estiver errado, erra
    # em escala e sem ninguém olhando. O ganho é real, mas não é urgente.

  pre_tasks:
    # O serviço do systemd NÃO herda o ambiente do seu shell. Sem estas
    # verificações, a primeira execução agendada falharia por falta da senha
    # do vault — e falharia em silêncio, já que ninguém está olhando às 14h
    # de quarta. Melhor descobrir agora, na instalação.
    - name: Confirmar que o arquivo de senha do vault existe
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.ansible_vault_pass"
      register: vault_pass_file

    - name: Abortar se o arquivo de senha do vault não existir
      ansible.builtin.fail:
        msg: >-
          {{ ansible_env.HOME }}/.ansible_vault_pass não existe. O serviço
          agendado precisa dele para abrir o vault, e não herda a variável
          ANSIBLE_VAULT_PASSWORD_FILE do seu shell.
      when: not vault_pass_file.stat.exists

    - name: Confirmar que a senha do SMTP está no vault
      ansible.builtin.assert:
        that:
          - vault_senha_smtp is defined
          - vault_senha_smtp != 'TROCAR'
        fail_msg: >-
          vault_senha_smtp não está preenchida. Sem ela a auditoria roda mas
          não consegue enviar o relatório — e você não seria avisado disso.
          Use: ansible-vault edit group_vars/all/vault.yml
        quiet: true

  tasks:
    # O agendamento único de quarta às 14h foi substituído pelo de
    # auditoria_agenda. Remover as unidades antigas evita que as duas
    # programações convivam e ninguém entenda por que a auditoria roda duas
    # vezes — ou por que roda num horário que não está em lugar nenhum.
    - name: Desativar o agendamento único antigo
      ansible.builtin.systemd_service:
        name: ansible-auditoria.timer
        enabled: false
        state: stopped
      become: true
      failed_when: false

    - name: Remover as unidades antigas
      ansible.builtin.file:
        path: "/etc/systemd/system/ansible-auditoria.{{ item }}"
        state: absent
      loop: [service, timer]
      become: true

    - name: Criar as unidades de serviço
      ansible.builtin.copy:
        dest: "/etc/systemd/system/ansible-auditoria-{{ item.nome }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description=Auditoria de desvio — {{ item.labs | join(', ') }} ({{ item.motivo }})
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User={{ ansible_user_id }}
          WorkingDirectory={{ playbook_dir }}

          # Sem esta linha o serviço não abre o vault: systemd não herda o
          # ambiente do shell de quem instalou.
          Environment=ANSIBLE_VAULT_PASSWORD_FILE={{ ansible_env.HOME }}/.ansible_vault_pass

          # Um ExecStart por laboratório. Type=oneshot os executa em sequência
          # e considera o serviço com falha se qualquer um falhar.
          {% for lab in item.labs %}
          ExecStart=/usr/bin/ansible-playbook {{ playbook_dir }}/auditoria.yml -e alvo={{ lab }}
          {% endfor %}
      loop: "{{ auditoria_agenda }}"
      loop_control:
        label: "{{ item.nome }} — {{ item.labs | join(', ') }}"
      become: true

    - name: Criar os timers
      ansible.builtin.copy:
        dest: "/etc/systemd/system/ansible-auditoria-{{ item.nome }}.timer"
        mode: "0644"
        content: |
          [Unit]
          Description=Auditoria semanal — {{ item.labs | join(', ') }}

          [Timer]
          OnCalendar={{ item.quando }}
          Persistent=true
          # Sem atraso aleatório: o horário foi escolhido para cair DENTRO de
          # uma aula, e um deslocamento de dez minutos pode jogá-lo para fora
          # da janela. O antigo tinha 600s porque o horário era palpite.
          RandomizedDelaySec=120

          [Install]
          WantedBy=timers.target
      loop: "{{ auditoria_agenda }}"
      loop_control:
        label: "{{ item.nome }} — {{ item.quando }}"
      become: true

    - name: Ativar os timers
      ansible.builtin.systemd_service:
        name: "ansible-auditoria-{{ item.nome }}.timer"
        enabled: true
        state: started
        daemon_reload: true
      loop: "{{ auditoria_agenda }}"
      loop_control:
        label: "{{ item.nome }}"
      become: true

    # Uma execução de verdade agora, pelo systemd, com o ambiente que ele
    # usará de fato. É a única forma de saber se a senha do vault e o envio
    # de e-mail funcionam no contexto do serviço — testar pelo shell não
    # prova nada, porque o shell tem variáveis que o systemd não tem.
    # --no-block é obrigatório. Sem ele, 'systemctl start' de um serviço
    # Type=oneshot BLOQUEIA até o serviço terminar — a auditoria dos cinco
    # laboratórios inteiros, com timeout de WinRM em cada máquina desligada.
    # Na instalação de 01/09/2026 isso deixou o playbook mudo por mais de
    # vinte minutos, e a tarefa de espera abaixo virou código morto, porque
    # só começava depois que o serviço já havia acabado.
    - name: Executar uma vez para validar o contexto do serviço
      ansible.builtin.command: systemctl start --no-block ansible-auditoria.service
      become: true
      changed_when: true

    - name: Aguardar a conclusão
      ansible.builtin.command: systemctl is-active ansible-auditoria.service
      register: exec_estado
      until: exec_estado.stdout | trim != 'activating'
      # Cerca de 10 minutos por laboratório: cada um percorre ~30 máquinas e
      # gasta o timeout de WinRM nas que estiverem desligadas. Um valor fixo
      # expirava antes do fim assim que a lista passou de um lab.
      retries: "{{ auditoria_alvos | length * 40 }}"
      delay: 15
      changed_when: false
      failed_when: false
      become: true

    - name: Ler o resultado da execução
      ansible.builtin.command: systemctl show ansible-auditoria.service -p Result --value
      register: exec_resultado
      changed_when: false
      become: true

    - name: Confirmar
      ansible.builtin.debug:
        msg: |
          Timer instalado e validado.

          Execução de teste: {{ exec_resultado.stdout | trim }}
          {% if exec_resultado.stdout | trim != 'success' %}

          ATENÇÃO — a execução pelo systemd falhou. Ver o motivo com:
            journalctl -u ansible-auditoria.service -n 50 --no-pager

          O timer está ativo, mas vai falhar toda quarta até isso ser
          resolvido.
          {% else %}
          Próxima execução automática:
            systemctl list-timers ansible-auditoria.timer
          {% endif %}
