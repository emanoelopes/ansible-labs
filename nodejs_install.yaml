---
# Instala o Node.js nas estações.
#
#   ansible-playbook nodejs_install.yaml -e alvo=lab2
#
# ATENÇÃO: a versão está fixada em 16.15.0, cujo suporte terminou em
# setembro de 2023. O product_id abaixo é específico dessa versão — trocar a URL
# sem trocar o product_id faz o Ansible achar que já está instalado.
#
# Alternativa mais simples de manter, sem product_id nem URL:
#   chocolatey.chocolatey.win_chocolatey: {name: nodejs-lts, state: latest}

- name: Node.js
  hosts: "{{ alvo | default('nao_definido') }}"
  gather_facts: false

  vars:
    nodejs_versao: '16.15.0'
    nodejs_product_id: '{366E8C2E-9CE0-4306-ABBB-E32CC4C328A0}'

  tasks:
    - name: Instalar o Node.js
      ansible.windows.win_package:
        path: "https://nodejs.org/dist/v{{ nodejs_versao }}/node-v{{ nodejs_versao }}-x64.msi"
        product_id: "{{ nodejs_product_id }}"
        arguments:
          - /install
          - /qn
