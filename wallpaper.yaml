---
# ┌────────────────────────────────────────────────────────────────────────┐
# │ ESTE PLAYBOOK FOI SUBSTITUÍDO EM 10/09/2026 — NÃO FAZ MAIS NADA        │
# └────────────────────────────────────────────────────────────────────────┘
#
# Use:
#
#   ansible-playbook estado.yml -e alvo=lab4 -t aparencia
#
# ── POR QUE SAIU ──────────────────────────────────────────────────────────
#
# A versão anterior escrevia em HKCU — a chave do usuário QUE EXECUTA. Como
# o Ansible conecta como 'suporte', o papel de parede era definido para o
# suporte, e o 'aluno', que é quem usa a máquina, nunca via diferença.
#
# O playbook reportava sucesso a cada execução. Não havia como perceber o
# erro pela saída: ele fazia exatamente o que dizia, na chave errada.
#
# Não há saída por HKLM — a personalização da área de trabalho é por usuário
# por design do Windows, e não existe chave de máquina equivalente. É preciso
# resolver o SID do aluno e escrever na chave dele, mais em HKU\.DEFAULT,
# que é o modelo herdado por perfil novo. É o que a tag 'aparencia' faz.
#
# Havia um segundo defeito: nenhum playbook copiava a imagem. Todos assumiam
# que wallpapersmd.jpg já estava em C:\Windows\Web\Wallpaper\Windows. Onde
# faltasse, o registro apontava para um arquivo inexistente e a área de
# trabalho voltava ao padrão do Windows, em silêncio. Agora a imagem vem do
# espelho HTTP do controlador, que serve a pasta windows_instaladores do
# Samba — e a tarefa falha dizendo qual máquina não a tem, em vez de
# configurar um caminho vazio.
#
# O arquivo foi mantido, e não apagado, porque o nome aparece em roteiros e
# cartões antigos. Quem o executar agora recebe a instrução em vez de
# desfazer a correção.

- name: Papel de parede — este playbook foi substituído
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Apontar o caminho certo
      ansible.builtin.fail:
        msg: |
          wallpaper.yaml não faz mais nada.

          Ele escrevia no perfil do 'suporte' em vez do 'aluno', e não
          copiava a imagem para a máquina. As duas coisas estão corrigidas
          no estado declarado:

            ansible-playbook estado.yml -e alvo=lab4 -t aparencia

          Requer o espelho local no ar:

            ansible-playbook repo_local.yml
