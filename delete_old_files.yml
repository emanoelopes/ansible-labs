---
- name: Remove old user files and directories
  hosts: "{{ local }}"
  gather_facts: false
  vars:
    directories: ['C:\Users\aluno\Downloads','C:\Users\aluno\Desktop','C:\Users\aluno\Documents','C:\Users\aluno\Videos','C:\Users\aluno\Pictures']
  tasks:
    - name: Collect directories
      tags: always
      win_find:
        paths: "{{ directories }}"
        file_type: directory
      register: collected_directories

    - name: Remove directories
      tags: never,delete
      win_file:
        path: "{{ item.path }}"
        state: absent
      with_items: "{{ collected_directories.files }}"

    - name: Collect files
      tags: always
      win_find:
        paths: "{{ directories }}"
      register: collected_files

    - name: Collect links
      tags: always
      win_find:
        paths: "{{ directories }}"
        patterns: ['*.lnk']
      register: collected_links

    # Prévia sem apagar nada. Rode sempre isto antes do -t delete.
    - name: Listar o que seria removido
      ansible.builtin.debug:
        msg: |
          Seriam removidos de {{ inventory_hostname }}:
            {{ (collected_files.files | map(attribute='path') | list)
               | difference(collected_links.files | map(attribute='path') | list)
               | length }} arquivo(s)
            {{ collected_directories.files | length }} diretório(s)
          Atalhos preservados: {{ collected_links.files | length }}
      tags: never,listar

    # A condição anterior era:
    #   when: collected_files.files != collected_links.files
    # Ela comparava as DUAS LISTAS INTEIRAS e não mencionava 'item', então valia
    # igual para todos os itens do laço: como as listas quase nunca são
    # idênticas, o resultado era sempre verdadeiro e os atalhos .lnk eram
    # apagados junto — o oposto da intenção.
    #
    # Agora a checagem é por item, comparando o caminho com a lista de atalhos.
    - name: Remove files
      tags: never,delete
      win_file:
        path: "{{ item.path }}"
        state: absent
      with_items: "{{ collected_files.files }}"
      when: item.path not in (collected_links.files | map(attribute='path') | list)

    # - name: Only extension
    #   debug:
    #     msg: "{{ collected_files != collected_links }}"
    #    loop: "{{ collected_links.files }}"
