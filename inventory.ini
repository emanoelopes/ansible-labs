[avell]
# GRUPO VAZIO DESDE 08/09/2026.
#
# Os dois notebooks Avell que ocupavam as posições 127 e 137 do lab1 eram
# provisórios e saíram. A 127 recebeu um Dell Inspiron 5400 AIO e passou
# para [lab1]; a 137 ficou vazia.
#
# O grupo permanece declarado, e não é descuido: [avell:vars] define
# conexão por SSH na porta 22, e apagá-lo faria perder essa configuração
# caso os notebooks voltem. Mas enquanto estiver vazio, qualquer playbook
# com '-e alvo=avell' roda sem alvo nenhum e termina em silêncio.
#
# Fica a lição do período em que a 127 esteve aqui: máquina no grupo
# errado conecta pelo protocolo errado e some da automação inteira —
# estado declarado, auditoria, inventário de software, coleta de MAC. E
# não aparece como falha, aparece como ausência. Ausência não alerta.

[ppgte]
ppgte-server ansible_host=10.102.227.245

[ppgte:vars]
ansible_connection=ssh
ansible_port=22

[avell:vars]
ansible_connection=ssh
ansible_port=22

[lab3:vars]
# Reativado em 11/09/2026: grupo [macos:children] abaixo faz
# group_vars/macos/main.yml e group_vars/macos/vault.yml serem carregados
# (ansible_user, ansible_password, ansible_become_password).
#
# Ainda fora do estado declarado, da auditoria semanal e do inventário de
# software (todos construídos sobre Chocolatey e WinRM, que não existem no
# lab3). O equivalente macOS do estado_lab seria o Homebrew, mas hoje as
# listas de pacotes do lab3 continuam escritas dentro do lab3.yaml, em vez
# de declaradas em group_vars — migração fica para um próximo ciclo.
ansible_connection=ssh
ansible_port=22
ansible_python_interpreter=auto_silent

[lab1:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_transport=ntlm

[lab2:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_transport=ntlm

[lab4:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_transport=ntlm

[lab5:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_transport=ntlm

[lab6:vars]
ansible_connection=winrm
ansible_user=suporte
ansible_port=5985
ansible_winrm_transport=ntlm

# Grupo guarda-chuva dos labs Windows. Faz com que group_vars/windows.yml
# aplique a credencial de conexão só neles, sem afetar lab3 (macOS),
# avell e ppgte, que conectam por SSH.
[windows:children]
lab1
lab2
lab4
lab5
lab6

# Grupo guarda-chuva do(s) lab(s) macOS. Faz com que group_vars/macos/
# (main.yml e vault.yml) apliquem a credencial SSH só no lab3.
[macos:children]
lab3

[all:vars]
ansible_user=suporte
ansible_winrm_server_cert_validation=ignore

