---
# Desliga as estações de um laboratório.
#
#   ansible-playbook desligar.yml -e alvo=lab1
#   ansible-playbook desligar.yml -e alvo=lab1 --limit 111
#   ansible-playbook desligar.yml -e alvo=lab3          (macOS)
#
# Para reiniciar em vez de desligar:
#   ansible-playbook desligar.yml -e alvo=lab1 -e acao=reiniciar
#
# ── LABORATÓRIO PODE ESTAR EM USO ─────────────────────────────────────────
#
# SÓ VERIFICAR, sem desligar nada — mostra quem está logado e há quanto
# tempo a sessão está ociosa:
#   ansible-playbook desligar.yml -e alvo=lab2 -t verificar
#
# DESLIGAR COM AVISO NA TELA, dando tempo de salvar o trabalho:
#   ansible-playbook desligar.yml -e alvo=lab2 -e atraso=300
#
# SÓ TESTAR O AVISO no macOS, sem desligar nada de verdade (-t aviso roda
# só as duas tarefas do diálogo; pula a de desligar/reiniciar, que não tem
# tag):
#   ansible-playbook desligar.yml -e alvo=lab3 --limit 342 -e atraso=15 -t aviso
#
# O Windows exibe uma caixa de diálogo com a mensagem e a contagem
# regressiva. Quem estiver na máquina pode abortar com 'shutdown /a' no
# Executar, e a mensagem padrão diz isso.
#
# macOS (lab3) agora faz o mesmo: um 'display dialog' aparece na sessão do
# usuário logado no console, com 'giving up after {{ atraso }}' fazendo as
# vezes da contagem regressiva — a caixa some sozinha quando o tempo acaba,
# junto com o desligamento. Para cancelar: Terminal, 'sudo shutdown -c'.
#
# Implementado em 08/10/2026 depois de desligar 4 iMacs sem aviso nenhum na
# tela — o 'community.general.shutdown' não tem equivalente ao '/c' do
# Windows, então a mensagem ficava declarada em 'mensagem' e nunca chegava
# a ninguém no macOS. Sem usuário algum logado no console (ou com root no
# console, que é o que aparece sem sessão de verdade), a caixa não aparece
# e o desligamento segue silencioso — não há para quem avisar.
#
# SOBRE A DETECÇÃO: o autologon mantém o usuário 'aluno' com sessão aberta
# em TODA estação, ligada ou ociosa. Então "tem usuário logado" não
# distingue nada. O sinal útil é o TEMPO OCIOSO da sessão: alguns minutos
# indicam uso recente; horas indicam máquina esquecida ligada. É indício,
# não prova — quem acabou de sair para o café aparece como ativo, e quem
# está lendo na tela há vinte minutos aparece como ocioso.
#
# Por isso o playbook NÃO decide sozinho pular máquina: ele mostra, e você
# decide. Automatizar essa escolha seria dar ares de certeza a um palpite.

- name: Desligar estações
  hosts: "{{ alvo | default('nao_definido') }}"
  gather_facts: true

  vars:
    acao: desligar
    # Segundos até o desligamento. 0 é imediato; um valor maior exibe a
    # caixa de aviso na tela e dá margem para cancelar com 'shutdown /a'.
    # Com laboratório possivelmente em uso, 300 é razoável.
    atraso: 0
    mensagem: >-
      Suporte SMD: esta estacao sera desligada. Salve seu trabalho agora.
      Para cancelar, abra Executar (tecla Windows + R) e digite: shutdown /a

    # Sem aspas (simples ou duplas): o texto atravessa duas camadas de
    # quoting (shell, depois AppleScript) sem escape — uma aspa aqui fecha
    # a string na camada errada e quebra o comando inteiro, silenciosamente
    # (osascript falha, o diálogo nunca aparece, e o desligamento segue).
    mensagem_macos: >-
      Suporte SMD: esta estacao sera desligada. Salve seu trabalho agora.
      Para cancelar, abra o Terminal e digite: sudo shutdown -c

  tasks:
    - name: Confirmar que um alvo foi informado
      ansible.builtin.fail:
        msg: "Informe o laboratório: ansible-playbook desligar.yml -e alvo=lab1"
      when: alvo is not defined
      run_once: true
      delegate_to: localhost
      tags: always

    # ── Verificação: quem está logado e há quanto tempo está parado ───────
    #
    # 'quser' é localizado no cabeçalho e nos rótulos, mas o TEMPO OCIOSO
    # sai em formato fixo: 'none', minutos, ou 'h:mm'. Extrai-se por posição
    # e formato, não por nome de coluna — mesma lição do powercfg, onde
    # procurar texto traduzido quebrou a idempotência da energia.
    # macOS e Linux: 'w -h' lista uma linha por sessão, com a coluna IDLE.
    # O lab3 são 23 iMacs, e sem esta ramificação o '-t verificar' falhava
    # neles — a tarefa abaixo é win_shell, que não existe fora do Windows.
    - name: Levantar sessões e tempo ocioso (macOS e Linux)
      ansible.builtin.shell: w -h || true
      register: sessoes
      changed_when: false
      failed_when: false
      when: ansible_os_family | default('') != 'Windows'
      tags: [always, verificar]

    - name: Levantar sessões e tempo ocioso
      when: ansible_os_family | default('') == 'Windows'
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'SilentlyContinue'
        $saida = quser 2>$null
        if (-not $saida -or $saida.Count -lt 2) { 'SEM SESSAO'; exit 0 }
        foreach ($linha in $saida | Select-Object -Skip 1) {
          $c = ($linha.Trim() -split '\s{2,}')
          # penúltimo campo é o tempo ocioso; último é o horário de logon
          if ($c.Count -ge 3) { "{0} | ocioso: {1}" -f $c[0].TrimStart('>'), $c[-2] }
        }
      register: sessoes
      changed_when: false
      failed_when: false
      tags: [always, verificar]

    - name: Mostrar as sessões
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ (sessoes.stdout | default('') | trim) | default('sem resposta', true) }}
      tags: [always, verificar]

    - name: Parar aqui quando for só verificação
      ansible.builtin.meta: end_play
      when: "'verificar' in ansible_run_tags"
      tags: [always, verificar]

    - name: Avisar sobre o atraso escolhido
      ansible.builtin.debug:
        msg: >-
          {% if atraso | int == 0 %}
          ATRASO ZERO — desligamento imediato, sem aviso na tela. Se o
          laboratório pode estar em uso, cancele agora e repita com
          '-e atraso=300'.
          {% else %}
          Aviso na tela por {{ atraso }} segundos antes de desligar.
          {% endif %}
      run_once: true
      tags: always

    # async 1 + poll 0 = dispara e não espera. É obrigatório aqui: a máquina
    # derruba a conexão ao desligar, e sem isso o Ansible interpretaria o
    # sucesso do comando como falha de rede em todas as estações.
    # /c exibe a mensagem na caixa de aviso do Windows. Só aparece quando há
    # atraso: com /t 0 a máquina cai antes de qualquer coisa ser desenhada.
    - name: Desligar estação Windows
      ansible.windows.win_shell: >-
        shutdown /s /f /t {{ atraso }}
        {% if atraso | int > 0 %}/c "{{ mensagem | trim }}"{% endif %}
      async: 1
      poll: 0
      when:
        - ansible_os_family == 'Windows'
        - acao == 'desligar'

    - name: Reiniciar estação Windows
      ansible.windows.win_shell: >-
        shutdown /r /f /t {{ atraso }}
        {% if atraso | int > 0 %}/c "{{ mensagem | trim }}"{% endif %}
      async: 1
      poll: 0
      when:
        - ansible_os_family == 'Windows'
        - acao == 'reiniciar'

    # ── AVISO VISUAL NO macOS ───────────────────────────────────────────────
    #
    # Não dá pra mandar o diálogo direto: um processo root (launchd/Ansible
    # via become) não tem a sessão de janelas do usuário logado, e um
    # 'osascript' disparado assim falha calado ou nem aparece. 'launchctl
    # asuser <uid> sudo -u <usuario> osascript ...' é a ponte — entra no
    # bootstrap context da sessão gráfica daquele usuário antes de pedir o
    # diálogo. É o mesmo truque usado por MDM/Jamf para mostrar algo na
    # tela de scripts rodando como root.
    - name: Descobrir o usuário da sessão gráfica (macOS)
      ansible.builtin.shell: stat -f%Su /dev/console
      register: at_usuario_console
      changed_when: false
      failed_when: false
      tags: aviso
      when:
        - ansible_os_family == 'Darwin'
        - atraso | int > 0
        - acao in ['desligar', 'reiniciar']

    # async maior que o atraso: sem isso o wrapper do Ansible mata o
    # osascript no fim do tempo padrão (geralmente bem menor que 600s),
    # cortando o diálogo antes do 'giving up after' dele mesmo ter chance de
    # fechar sozinho — e a mensagem some da tela antes da hora, sem que
    # nada acuse erro aqui.
    - name: Mostrar aviso visual na tela (macOS)
      ansible.builtin.shell: >-
        launchctl asuser $(id -u "{{ at_usuario_console.stdout | trim }}")
        sudo -u "{{ at_usuario_console.stdout | trim }}"
        osascript -e 'display dialog "{{ mensagem_macos | trim }}" with title "Suporte SMD" buttons {"OK"} default button "OK" giving up after {{ atraso }}'
      become: true
      async: "{{ atraso | int + 15 }}"
      poll: 0
      tags: aviso
      when:
        - ansible_os_family == 'Darwin'
        - atraso | int > 0
        - acao in ['desligar', 'reiniciar']
        - at_usuario_console.stdout is defined
        - at_usuario_console.stdout | trim != ''
        - at_usuario_console.stdout | trim != 'root'

    - name: Desligar estação macOS ou Linux
      community.general.shutdown:
        delay: "{{ atraso }}"
      become: true
      when:
        - ansible_os_family != 'Windows'
        - acao == 'desligar'

    - name: Reiniciar estação macOS ou Linux
      ansible.builtin.reboot:
        post_reboot_delay: 0
      become: true
      when:
        - ansible_os_family != 'Windows'
        - acao == 'reiniciar'

    - name: Registrar o que foi disparado
      ansible.builtin.debug:
        msg: >-
          {{ acao }} disparado em {{ inventory_hostname }}
          ({{ ansible_os_family }}). O Ansible não aguarda confirmação —
          a conexão cai junto com a máquina.
