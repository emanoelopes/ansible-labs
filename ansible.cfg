[defaults]
inventory=inventory.ini
forks=10
roles_path = ./roles
host_key_checking = False
callbacks_enabled = timer, profile_tasks, profile_roles

# NÃO defina vault_password_file aqui. Este arquivo é versionado, e o Ansible
# trata um vault_password_file inexistente como erro FATAL de configuração —
# o que quebrava todo o CI, onde o arquivo obviamente não existe.
#
# Configure na sua máquina, fora do repositório, com uma destas opções:
#
#   export ANSIBLE_VAULT_PASSWORD_FILE=~/.ansible_vault_pass   (no ~/.bashrc)
#
# ou em ~/.ansible.cfg (arquivo pessoal, não versionado):
#   [defaults]
#   vault_password_file = ~/.ansible_vault_pass

