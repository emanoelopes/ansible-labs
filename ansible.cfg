[defaults]
inventory=inventory.ini
forks=10
roles_path = ./roles
host_key_checking = False
callbacks_enabled = timer, profile_tasks, profile_roles

# Senha do Ansible Vault. O arquivo fica FORA do repositório, com chmod 600.
# Criar com:  echo 'SUA_SENHA' > ~/.ansible_vault_pass && chmod 600 ~/.ansible_vault_pass
vault_password_file = ~/.ansible_vault_pass

