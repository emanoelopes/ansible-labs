---
# Máquina piloto da rotação de senha da conta 'suporte' (ago/2026).
#
# A 111 já está com a senha NOVA; as demais 163 continuam com a antiga.
# host_vars tem precedência sobre group_vars, então esta linha sobrepõe o
# ansible_password definido em group_vars/windows.yml apenas para este host.
#
# É assim que se isola uma máquina. Trocar o valor de vault_senha_suporte no
# vault NÃO faz isso: o vault é global, e a troca quebraria a autenticação em
# todas as outras.
#
# QUANDO A ROTAÇÃO SE COMPLETAR EM TODOS OS LABORATÓRIOS:
#   1. mova vault_senha_suporte_nova -> vault_senha_suporte no vault
#   2. apague este arquivo
ansible_password: "{{ vault_senha_suporte_nova }}"
