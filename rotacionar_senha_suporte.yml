---
# Rotação da senha da conta administrativa 'suporte' das estações Windows.
#
# POR QUE UM PLAYBOOK SEPARADO
# A conta 'suporte' é a credencial de conexão (group_vars/windows.yml). Trocar
# a senha e a variável de conexão ao mesmo tempo derruba o acesso a todas as
# máquinas. Por isso a troca usa DUAS variáveis do vault:
#
#   vault_senha_suporte        -> senha ATUAL, usada para conectar
#   vault_senha_suporte_nova   -> senha NOVA, que será gravada nas máquinas
#
# COMO USAR
#   1. Combine a troca com o Peterson antes de rodar.
#   2. Acrescente vault_senha_suporte_nova ao vault:
#        ansible-vault edit group_vars/all/vault.yml
#   3. Piloto em UMA máquina:
#        ansible-playbook rotacionar_senha_suporte.yml -e alvo=lab1 --limit 111
#   4. Confirme que o login manual com a senha nova funciona nessa máquina.
#   5. Rode por laboratório, conferindo o resumo final de cada um:
#        ansible-playbook rotacionar_senha_suporte.yml -e alvo=lab1
#   6. SÓ DEPOIS que todos os labs estiverem 100%: no vault, mova o valor de
#      vault_senha_suporte_nova para vault_senha_suporte e apague a var nova.
#
# ATENÇÃO: enquanto houver máquina pendente (desligada, fora da rede), o
# vault_senha_suporte PRECISA continuar com a senha antiga — é com ela que o
# Ansible alcança as que faltam. Máquinas rotacionadas continuam acessíveis
# porque este playbook não depende do vault estar atualizado.

- name: Rotacionar a senha da conta 'suporte'
  hosts: "{{ alvo | default('windows') }}"
  gather_facts: false
  serial: "25%"
  ignore_unreachable: true

  pre_tasks:
    - name: Abortar se a senha nova não foi definida no vault
      ansible.builtin.assert:
        that:
          - vault_senha_suporte_nova is defined
          - vault_senha_suporte_nova | length >= 12
          - vault_senha_suporte_nova != vault_senha_suporte
        fail_msg: >-
          Defina vault_senha_suporte_nova em group_vars/all/vault.yml,
          com no mínimo 12 caracteres e diferente da senha atual.
      run_once: true
      delegate_to: localhost

  tasks:
    - name: Confirmar acesso com a senha atual
      ansible.windows.win_ping:

    - name: Gravar a nova senha na conta 'suporte'
      ansible.windows.win_user:
        name: suporte
        password: "{{ vault_senha_suporte_nova }}"
        update_password: always
        state: present
        password_never_expires: true
      no_log: true
      register: troca

    - name: Validar login com a NOVA senha
      ansible.windows.win_ping:
      vars:
        ansible_password: "{{ vault_senha_suporte_nova }}"
      register: validacao
      ignore_unreachable: true
      ignore_errors: true

    # Sem esta tarefa, um host cuja validação falhasse continuaria contado como
    # OK no resumo: o 'ignore_unreachable: true' do play impede que a falha de
    # autenticação o remova de ansible_play_hosts. E falha de autenticação em
    # WinRM aparece como UNREACHABLE, não como failed.
    #
    # É o pior cenário possível desta rotação — a senha foi trocada na máquina
    # mas não se conseguiu confirmar qual ficou valendo. Precisa gritar.
    - name: Falhar explicitamente se a nova senha não autenticou
      ansible.builtin.fail:
        msg: >-
          A senha de {{ inventory_hostname }} foi ALTERADA mas o login com a
          senha nova não funcionou. A máquina pode ter ficado inacessível.
          Verifique manualmente antes de prosseguir com os demais laboratórios.
      when: (validacao is unreachable) or (validacao is failed)

  post_tasks:
    # ansible_play_hosts traz os hosts que continuam ativos; os que saíram
    # falharam ou ficaram inalcançáveis. Com 'serial', este resumo sai uma vez
    # por leva — some as levas para ter o total do laboratório.
    - name: Resumo da rotação (esta leva)
      ansible.builtin.debug:
        msg: |
          Rotacionadas e validadas: {{ ansible_play_hosts | length }} de {{ ansible_play_hosts_all | length }}
          {% set pendentes = ansible_play_hosts_all | difference(ansible_play_hosts) %}
          {% if pendentes | length > 0 %}
          PENDENTES: {{ pendentes | join(', ') }}

          Podem estar desligadas (repita depois, a senha antiga ainda vale nelas)
          ou ter falhado a validação (verifique manualmente — nessas a senha
          pode já ter mudado).
          {% else %}
          Nenhuma pendência nesta leva.
          {% endif %}

          Enquanto houver pendência em QUALQUER laboratório, mantenha
          vault_senha_suporte com a senha ANTIGA.
      run_once: true
      delegate_to: localhost
