---
# Estado desejado de uma estação de laboratório.
#
# Estes são os valores base. Cada laboratório sobrescreve o que for diferente
# em group_vars/lab1.yml, group_vars/lab2.yml e assim por diante.
#
# Diferença em relação ao resto do projeto: NADA aqui está atrás de tag 'never'.
# Rodar a role sem tag nenhuma significa "coloque esta máquina no estado
# declarado". É essa a mudança de modelo — de receita acionada à mão para
# convergência para um estado.

# --- Software -----------------------------------------------------------------
# A lista efetiva de pacotes é a soma de duas:
#
#   estado_pacotes_base   -> group_vars/windows.yml, vale para os 5 labs Windows
#   estado_pacotes_extra  -> group_vars/<lab>.yml, o que aquele lab tem a mais
#
# Motivo: 14 pacotes são comuns a todos os laboratórios. Repeti-los em cinco
# arquivos obrigaria a editar os cinco para trocar um item do núcleo, e é
# assim que listas divergem sem ninguém perceber.
#
# Ambas vazias por padrão: lab sem declaração nenhuma não instala nada.
estado_pacotes_base: []
estado_pacotes_extra: []

# state: latest atualiza a cada execução; present só garante presença.
# 'present' é o default por ser menos intrusivo em máquina de aula.
estado_pacotes_versao: present

# --- Energia ------------------------------------------------------------------
# Plano de energia permanente da estação.
estado_plano_energia: 'Equilibrado'

# Tempo em MINUTOS até a ação, na alimentação por tomada. 0 desativa.
#
# POR QUE A SUSPENSÃO FICA DESATIVADA POR PADRÃO
# Máquina suspensa não responde a WinRM, e a auditoria semanal a reporta como
# inalcançável — sem distinguir de desligada. O resultado é perseguir
# problemas inexistentes e não enxergar desvios reais. Numa sala gerenciada
# remotamente, previsibilidade de acesso vale mais que a economia da
# suspensão; o desligamento diário às 23h já cobre o consumo noturno.
#
# Se preferir manter a suspensão, o caminho é habilitar Wake-on-LAN e acordar
# as máquinas antes de cada execução — mais economia, mais peças móveis.
estado_suspender_apos_min: 0      # 0 = nunca suspende
estado_desligar_monitor_min: 15   # o monitor continua desligando

# A hibernação ocupa em disco o equivalente à memória RAM, no hiberfil.sys.
# Desativá-la libera esse espaço — relevante num parque onde a falta de disco
# impediu instalações. O custo é perder a Inicialização Rápida do Windows.
estado_hibernacao: false

# Desligamento automático. Defina estado_desligar_hora como null para não criar
# a tarefa agendada.
estado_desligar_hora: '23:00'
estado_desligar_nome_tarefa: 'Desligar às 23h'

# --- Sessão -------------------------------------------------------------------
# Usuário de logon automático. null desativa a configuração (não remove a
# existente — remover exigiria uma tarefa explícita).
estado_autologon_usuario: null

# --- Controle de execução -----------------------------------------------------
# Quando true, a role só relata divergências sem corrigir. Útil para auditoria
# antes de aplicar em lote.
estado_somente_auditar: false
