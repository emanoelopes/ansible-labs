---
# Converge a estação para o estado declarado em group_vars/<lab>.yml.
#
# Todas as tarefas são idempotentes e suportam --check, para que
#   ansible-playbook estado.yml -e alvo=lab1 --check --diff
# funcione como detector de desvio: o que aparecer como 'changed' é exatamente
# o que está fora do estado declarado.
#
# TAGS
#   pacotes  -> instalação de software (a parte demorada)
#   energia  -> plano, suspensão, monitor, hibernação, desligamento diário
#   sessao   -> logon automático
#
# Sem tag nenhuma, roda tudo. Para aplicar só a energia, que leva segundos:
#   ansible-playbook estado.yml -e alvo=lab1 -t energia

- name: Compor a lista efetiva de pacotes
  ansible.builtin.set_fact:
    estado_pacotes: >-
      {{ (estado_pacotes_base + estado_pacotes_extra) | unique | sort }}
  tags: always

- name: Validar que o estado foi declarado para este host
  ansible.builtin.assert:
    that:
      - estado_pacotes | length > 0
    fail_msg: >-
      Nenhum pacote declarado para {{ inventory_hostname }} (grupo(s):
      {{ group_names | join(', ') }}). Defina estado_pacotes_base em
      group_vars/windows.yml e/ou estado_pacotes_extra em
      group_vars/<lab>.yml.
    success_msg: >-
      {{ estado_pacotes | length }} pacotes
      ({{ estado_pacotes_base | length }} do núcleo +
      {{ estado_pacotes_extra | length }} específicos do laboratório)
    quiet: true
  tags: always

# --- Software -----------------------------------------------------------------

# Um pacote por iteração, e não uma lista única: assim a falha de um pacote
# identifica qual falhou e não derruba os demais.
- name: Garantir que os pacotes declarados estão instalados
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ item }}"
    state: "{{ estado_pacotes_versao }}"
  loop: "{{ estado_pacotes }}"
  register: estado_choco
  failed_when: false
  check_mode: "{{ estado_somente_auditar or ansible_check_mode }}"
  tags: pacotes

- name: Relatar pacotes que não puderam ser instalados
  ansible.builtin.debug:
    msg: >-
      Falharam em {{ inventory_hostname }}:
      {{ estado_choco.results | selectattr('failed') | map(attribute='item') | list }}
  when: estado_choco.results | default([]) | selectattr('failed') | list | length > 0
  tags: pacotes

# --- Energia ------------------------------------------------------------------

- name: Garantir o plano de energia
  community.windows.win_power_plan:
    name: "{{ estado_plano_energia }}"
  tags: energia

# O win_power_plan só escolhe o plano; os tempos de suspensão vêm do padrão
# do plano. Aqui eles passam a ser declarados.
#
# A idempotência é feita à mão: lê-se o valor atual com 'powercfg /query',
# compara-se com o desejado, e só se aplica quando difere. Sem isso a tarefa
# reportaria 'changed' em toda execução e o --check da auditoria ficaria
# inútil justamente nesta parte.
- name: Ajustar suspensão, monitor e hibernação
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $mudou = $false

    function IndiceAtual($sub, $setting) {
      $saida = powercfg /query SCHEME_CURRENT $sub $setting 2>$null
      $linha = $saida | Select-String 'Current AC Power Setting Index'
      if (-not $linha) { return $null }
      return [Convert]::ToInt32(($linha -split ':')[-1].Trim(), 16)
    }

    # powercfg trabalha em segundos; a declaração é em minutos.
    $alvoSuspender = {{ estado_suspender_apos_min }} * 60
    $alvoMonitor   = {{ estado_desligar_monitor_min }} * 60

    if ((IndiceAtual 'SUB_SLEEP' 'STANDBYIDLE') -ne $alvoSuspender) {
      powercfg /change standby-timeout-ac {{ estado_suspender_apos_min }}
      $mudou = $true
    }

    if ((IndiceAtual 'SUB_VIDEO' 'VIDEOIDLE') -ne $alvoMonitor) {
      powercfg /change monitor-timeout-ac {{ estado_desligar_monitor_min }}
      $mudou = $true
    }

    $hiberAtiva = Test-Path 'C:\hiberfil.sys'
    $hiberDesejada = ${{ estado_hibernacao | lower }}
    if ($hiberAtiva -ne $hiberDesejada) {
      if ($hiberDesejada) { powercfg /hibernate on } else { powercfg /hibernate off }
      $mudou = $true
    }

    if ($mudou) { 'ALTERADO' } else { 'ja conforme' }
  register: energia
  changed_when: "'ALTERADO' in energia.stdout"
  tags: energia

- name: Garantir a tarefa de desligamento automático
  community.windows.win_scheduled_task:
    name: "{{ estado_desligar_nome_tarefa }}"
    description: "Desliga a estação diariamente às {{ estado_desligar_hora }}"
    actions:
      - path: shutdown.exe
        arguments: /s /f
    triggers:
      - type: daily
        start_boundary: "2026-01-01T{{ estado_desligar_hora }}:00"
    username: SYSTEM
    run_level: highest
    wake_to_run: yes
    state: present
    enabled: yes
  when: estado_desligar_hora is not none
  tags: energia

# --- Sessão -------------------------------------------------------------------

- name: Garantir o logon automático
  ansible.windows.win_auto_logon:
    username: "{{ estado_autologon_usuario }}"
    password: "{{ vault_senha_aluno }}"
  when: estado_autologon_usuario is not none
  no_log: true
  tags: sessao
