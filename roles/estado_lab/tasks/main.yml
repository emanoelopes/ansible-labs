---
# Converge a estação para o estado declarado em group_vars/<lab>.yml.
#
# Todas as tarefas são idempotentes e suportam --check, para que
#   ansible-playbook estado.yml -e alvo=lab1 --check --diff
# funcione como detector de desvio: o que aparecer como 'changed' é exatamente
# o que está fora do estado declarado.
#
# TAGS
#   pacotes  -> instalação de software (a parte demorada)
#   energia  -> plano, suspensão, monitor, hibernação, desligamento diário
#   sessao   -> logon automático
#
# Sem tag nenhuma, roda tudo. Para aplicar só a energia, que leva segundos:
#   ansible-playbook estado.yml -e alvo=lab1 -t energia

- name: Compor a lista efetiva de pacotes
  ansible.builtin.set_fact:
    estado_pacotes: >-
      {{ (estado_pacotes_base + estado_pacotes_extra) | unique | sort }}
  tags: always

- name: Validar que o estado foi declarado para este host
  ansible.builtin.assert:
    that:
      - estado_pacotes | length > 0
    fail_msg: >-
      Nenhum pacote declarado para {{ inventory_hostname }} (grupo(s):
      {{ group_names | join(', ') }}). Defina estado_pacotes_base em
      group_vars/windows.yml e/ou estado_pacotes_extra em
      group_vars/<lab>.yml.
    success_msg: >-
      {{ estado_pacotes | length }} pacotes
      ({{ estado_pacotes_base | length }} do núcleo +
      {{ estado_pacotes_extra | length }} específicos do laboratório)
    quiet: true
  tags: always

# --- Software -----------------------------------------------------------------

# Um pacote por iteração, e não uma lista única: assim a falha de um pacote
# identifica qual falhou e não derruba os demais.
#
# ── ARGUMENTOS POR PACOTE ─────────────────────────────────────────────────
#
# estado_pacotes_args mapeia pacote -> argumentos do INSTALADOR. Existe por
# causa de um problema que nenhuma variável de ambiente resolve.
#
# O Ansible conecta como 'suporte'. Instalador que grava no perfil do
# usuário grava no perfil do SUPORTE — e o aluno, que é quem usa a máquina,
# não enxerga nada. Não adianta apontar %APPDATA% para o aluno: o instalador
# resolve o perfil pelo TOKEN DE SEGURANÇA com que roda, e quem usa
# SHGetKnownFolderPath ignora a variável.
#
# A saída é instalar para todos os usuários, quando o instalador permite. O
# Arduino IDE 2.x é o caso típico: por padrão vai para
# %LOCALAPPDATA%\Programs\Arduino IDE, e com /ALLUSERS /S vai para
# %PROGRAMFILES%\Arduino IDE.
#
# Constatado no lab4 em 09/09/2026: o colega conseguiu instalar e nós não —
# a diferença não estava no comando, e sim em quem o executava. Ele estava
# sentado na máquina, na sessão do aluno (autologon).
#
# NEM TODO PROGRAMA SE RESOLVE ASSIM. O NetBeans, por exemplo, já instala em
# Program Files para todos; o que fica por usuário é a CONFIGURAÇÃO, no
# userdir %APPDATA%\NetBeans\<versão>. Argumento de instalador não alcança
# isso — ver o playbook de distribuição do userdir.
- name: Garantir que os pacotes declarados estão instalados
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ item }}"
    state: "{{ estado_pacotes_versao }}"
    install_args: "{{ estado_pacotes_args[item] | default(omit) }}"
  loop: "{{ estado_pacotes }}"
  register: estado_choco
  failed_when: false
  check_mode: "{{ estado_somente_auditar or ansible_check_mode }}"
  tags: pacotes

# O filtro tem que ser por rc, não por 'failed'.
#
# A tarefa acima usa 'failed_when: false' para que um pacote problemático não
# derrube os outros 30. O efeito colateral é que NADA fica marcado como
# failed — então este relatório, que filtrava por 'failed', nunca reportava
# nada. Instalação que não funcionava sumia sem deixar rastro.
#
# Foi assim com o anaconda3 no lab2: declarado, nunca instalado, e só
# descoberto em 03/09/2026 porque a auditoria semanal insistia em acusar 25
# máquinas fora do estado. Levou uma investigação inteira para chegar a algo
# que esta tarefa deveria ter dito na primeira execução.
- name: Relatar pacotes que não puderam ser instalados
  ansible.builtin.debug:
    msg: |
      Falharam em {{ inventory_hostname }}:
      {% for r in estado_falhas %}
        {{ r.item }} — rc {{ r.rc | default('?') }}: {{ (r.msg | default('sem mensagem')) | truncate(160) }}
      {% endfor %}
  vars:
    estado_falhas: >-
      {{ estado_choco.results | default([])
         | rejectattr('rc', 'undefined')
         | rejectattr('rc', 'equalto', 0) | list }}
  when: estado_falhas | length > 0
  tags: pacotes

# Sem isto a falha continua sendo apenas uma linha de debug no meio de
# centenas: visível para quem está olhando a saída rolar, invisível para
# quem lê só o PLAY RECAP — que é o caso de toda execução agendada.
- name: Falhar o host quando algum pacote não instalou
  ansible.builtin.fail:
    msg: >-
      {{ estado_falhas | length }} pacote(s) não instalaram em
      {{ inventory_hostname }}: {{ estado_falhas | map(attribute='item') | join(', ') }}
  vars:
    estado_falhas: >-
      {{ estado_choco.results | default([])
         | rejectattr('rc', 'undefined')
         | rejectattr('rc', 'equalto', 0) | list }}
  when:
    - estado_falhas | length > 0
    - not ansible_check_mode
  tags: pacotes

# --- Energia ------------------------------------------------------------------

- name: Garantir o plano de energia
  community.windows.win_power_plan:
    name: "{{ estado_plano_energia }}"
  tags: energia

# O win_power_plan só escolhe o plano; os tempos de suspensão vêm do padrão
# do plano. Aqui eles passam a ser declarados.
#
# A idempotência é feita à mão: lê-se o valor atual, compara-se com o desejado,
# e só se aplica quando difere. Sem isso a tarefa reportaria 'changed' em toda
# execução e o --check da auditoria ficaria inútil justamente nesta parte.
#
# ── NÃO VOLTE A LER A SAÍDA DO 'powercfg /query' (corrigido em 03/09/2026) ─
#
# A versão anterior procurava a linha 'Current AC Power Setting Index'. As
# estações têm Windows em português, onde o powercfg imprime "Índice de
# Configuração de Energia CA Atual" — em outra ordem e com "CA" no lugar de
# "AC". O Select-String nunca casava, a função devolvia $null, a comparação
# dava sempre diferente, e a tarefa reaplicava e reportava 'changed' em
# TODAS as máquinas, em TODA execução.
#
# O efeito colateral era o pior: a auditoria semanal detecta desvio pelo que
# aparece como 'changed' no --check. Com esta tarefa sempre mudando, as 157
# estações seriam reportadas como divergentes toda quarta-feira — e alerta
# que sempre dispara é alerta que ninguém lê.
#
# A leitura agora é do registro, por GUID. GUID não é traduzido. O da política
# ativa sai do 'powercfg /getactivescheme', cuja saída também é localizada,
# mas de onde se extrai só o GUID por expressão regular.
- name: Ajustar suspensão, monitor e hibernação
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $mudou = $false

    $rxGuid = '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    $ativo = ([regex]::Match((powercfg /getactivescheme | Out-String), $rxGuid)).Value
    if (-not $ativo) { throw 'Não foi possível identificar a política de energia ativa.' }
    $base = "HKLM:\SYSTEM\CurrentControlSet\Control\Power\User\PowerSchemes\$ativo"

    # $null quando a configuração nunca foi alterada em relação ao padrão da
    # política: a chave só passa a existir depois do primeiro 'powercfg
    # /change'. Isso faz a primeira execução reportar 'changed' mesmo que o
    # valor já esteja correto — e as seguintes, não. Converge sozinho.
    function IndiceAtual($sub, $setting) {
      $p = Join-Path $base "$sub\$setting"
      if (-not (Test-Path $p)) { return $null }
      return (Get-ItemProperty -Path $p -Name ACSettingIndex -ErrorAction SilentlyContinue).ACSettingIndex
    }

    # GUIDs fixos, os mesmos em qualquer idioma ou versão do Windows.
    $SUB_SLEEP    = '238c9fa8-0aad-41ed-83f4-97be242c8f20'
    $STANDBYIDLE  = '29f6c1db-86da-48c5-9fdb-f2b67b1f44da'
    $SUB_VIDEO    = '7516b95f-f776-4464-8c53-06167f40cc99'
    $VIDEOIDLE    = '3c0bc021-c8a8-4e07-a973-6b14cbcb2b7e'

    # powercfg trabalha em segundos; a declaração é em minutos.
    $alvoSuspender = {{ estado_suspender_apos_min }} * 60
    $alvoMonitor   = {{ estado_desligar_monitor_min }} * 60

    if ((IndiceAtual $SUB_SLEEP $STANDBYIDLE) -ne $alvoSuspender) {
      powercfg /change standby-timeout-ac {{ estado_suspender_apos_min }}
      $mudou = $true
    }

    if ((IndiceAtual $SUB_VIDEO $VIDEOIDLE) -ne $alvoMonitor) {
      powercfg /change monitor-timeout-ac {{ estado_desligar_monitor_min }}
      $mudou = $true
    }

    $hiberAtiva = Test-Path 'C:\hiberfil.sys'
    $hiberDesejada = ${{ estado_hibernacao | lower }}
    if ($hiberAtiva -ne $hiberDesejada) {
      if ($hiberDesejada) { powercfg /hibernate on } else { powercfg /hibernate off }
      $mudou = $true
    }

    if ($mudou) { 'ALTERADO' } else { 'ja conforme' }
  register: energia
  changed_when: "'ALTERADO' in energia.stdout"
  tags: energia

- name: Garantir a tarefa de desligamento automático
  community.windows.win_scheduled_task:
    name: "{{ estado_desligar_nome_tarefa }}"
    description: "Desliga a estação diariamente às {{ estado_desligar_hora }}"
    actions:
      - path: shutdown.exe
        arguments: /s /f
    triggers:
      - type: daily
        start_boundary: "2026-01-01T{{ estado_desligar_hora }}:00"
    username: SYSTEM
    run_level: highest
    wake_to_run: yes
    state: present
    enabled: yes
  when: estado_desligar_hora is not none
  tags: energia

# --- Sessão -------------------------------------------------------------------

- name: Garantir o logon automático
  ansible.windows.win_auto_logon:
    username: "{{ estado_autologon_usuario }}"
    password: "{{ vault_senha_aluno }}"
  when: estado_autologon_usuario is not none
  no_log: true
  tags: sessao
