---
# Role de preparação das máquinas da rede tecnodocência (grupo [tecnodocencia]
# do inventário), aplicada por tecnodocencia.yml.
#
# As senhas abaixo são PRÓPRIAS desta role e não têm relação com a credencial
# de conexão da equipe (essa fica em group_vars/windows.yml). Não reaproveitar
# vault_senha_suporte aqui: a conta 'Suporte' desta role é de outro contexto.
#
# Valores reais em group_vars/all/vault.yml (cifrado com ansible-vault).
senha_suporte: "{{ vault_senha_suporte_tecnodocencia }}"
senha_bolsista: "{{ vault_senha_bolsista }}"
