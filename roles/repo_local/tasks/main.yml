---
# Sobe o espelho HTTP. Roda no CONTROLADOR (hosts: localhost).

- name: Validar que repo_bind_ip foi preenchido e existe nesta máquina
  ansible.builtin.assert:
    that:
      - repo_bind_ip != 'PREENCHER'
      - repo_bind_ip in ansible_all_ipv4_addresses
    fail_msg: >-
      repo_bind_ip está como '{{ repo_bind_ip }}', que não é um endereço deste
      controlador. Os IPs desta máquina são {{ ansible_all_ipv4_addresses }}.
      Escolha o da rede dos laboratórios (10.102.227.0/24) e fixe em
      group_vars/all/main.yml. Sem isso o servidor HTTP nem sobe, e se subisse
      as estações baixariam do endereço errado.
    success_msg: "Repositório será publicado em {{ repo_interno_url }}"

- name: Verificar se a porta {{ repo_porta }} já está em uso
  ansible.builtin.wait_for:
    host: "{{ repo_bind_ip }}"
    port: "{{ repo_porta }}"
    timeout: 2
    state: stopped
  register: repo_porta_livre
  failed_when: false

- name: Falhar se a porta estiver ocupada por outro serviço
  ansible.builtin.fail:
    msg: >-
      Já há algo escutando em {{ repo_bind_ip }}:{{ repo_porta }}. Pare o
      serviço ou defina outra porta em repo_porta (group_vars/all/main.yml).
  when:
    - repo_porta_livre.failed | default(false)
    - not (repo_reusar_porta | default(false))

- name: Verificar dependências do controlador
  ansible.builtin.command: "which {{ item }}"
  loop:
    - mount.cifs
    - systemd-run
    - python3
  changed_when: false
  register: repo_deps
  failed_when: repo_deps.rc != 0

# A senha vai num arquivo de credenciais em vez de ir nas opções de montagem.
# Em 'opts', ela apareceria no /proc/mounts e na saída de 'mount' para qualquer
# usuário da máquina.
#
# Fica no HOME e não em /etc: assim esta tarefa dispensa sudo. O modo 0600 já
# restringe a leitura ao dono, que é o mesmo efeito prático do /etc/ com root.
- name: Criar arquivo de credenciais do Samba
  ansible.builtin.copy:
    dest: "{{ repo_cred_file }}"
    mode: "0600"
    content: |
      username={{ repo_smb_usuario }}
      password={{ repo_smb_senha }}
      domain={{ repo_smb_dominio }}
  no_log: true

# Esta role NÃO usa sudo. A preparação que exige root é feita uma única vez,
# à mão, e está descrita na mensagem de erro abaixo. Assim a execução do dia a
# dia — inclusive agendada — roda sem senha e sem NOPASSWD no sudoers.
- name: Verificar se o ponto de montagem existe
  ansible.builtin.stat:
    path: "{{ repo_mount_dir }}"
  register: repo_ponto

- name: Instruir a preparação inicial, se ainda não foi feita
  ansible.builtin.fail:
    msg: |
      Preparação inicial pendente. Execute UMA VEZ, como root:

        sudo mkdir -p {{ repo_mount_dir }}

      E acrescente esta linha ao /etc/fstab:

        {{ repo_smb_servidor }}  {{ repo_mount_dir }}  cifs  noauto,user,ro,vers=3.0,credentials={{ repo_cred_file }},uid={{ ansible_user_id }}  0  0

      A opção 'user' autoriza seu usuário a montar ESTE ponto específico, sem
      sudo. É privilégio bem mais estreito que um NOPASSWD para o comando
      mount, que na prática equivale a acesso root.
  when: not repo_ponto.stat.exists

- name: Verificar se já está montado
  ansible.builtin.command: "findmnt --noheadings --target {{ repo_mount_dir }}"
  register: repo_montado
  changed_when: false
  failed_when: false

# 'mount <ponto>' sem opções é a forma que a opção 'user' do fstab autoriza:
# o kernel só aceita os parâmetros que já estão declarados lá. Por isso não
# usamos o módulo mount aqui — ele monta uma linha de comando completa, que
# seria recusada sem privilégio.
- name: Montar o compartilhamento Samba (somente leitura)
  ansible.builtin.command: "mount {{ repo_mount_dir }}"
  register: repo_mount_rc
  changed_when: repo_mount_rc.rc == 0
  failed_when:
    - repo_mount_rc.rc != 0
    - "'already mounted' not in repo_mount_rc.stderr"
  when: repo_mount_dir not in repo_montado.stdout

- name: Confirmar que a subpasta de instaladores existe
  ansible.builtin.stat:
    path: "{{ repo_dir_publicado }}"
  register: repo_subpasta_stat

- name: Falhar se a subpasta não existir
  ansible.builtin.fail:
    msg: >-
      O compartilhamento montou, mas não há '{{ repo_subpasta }}' dentro de
      {{ repo_mount_dir }}. Confira o nome e a caixa das letras — o CIFS
      diferencia maiúsculas de minúsculas.
  when: not repo_subpasta_stat.stat.exists

- name: Confirmar que a subpasta tem conteúdo
  ansible.builtin.find:
    paths: "{{ repo_dir_publicado }}"
    file_type: file
  register: repo_conteudo

- name: Falhar se a subpasta estiver vazia
  ansible.builtin.fail:
    msg: >-
      {{ repo_dir_publicado }} montou mas está vazio. Sem os instaladores lá, as
      tarefas de download falhariam uma a uma nas 164 estações.
  when: repo_conteudo.matched | int == 0

# Unidade transitória do systemd em vez de nohup: ela pode ser consultada,
# parada de forma determinística e não fica órfã se o playbook abortar.
#
# --user: unidade do usuário, sem sudo. A porta 8081 é não privilegiada
# (acima de 1024), então não há motivo para o servidor rodar como root —
# ele serve arquivos de um ponto montado somente-leitura.
- name: Verificar se o repositório já está no ar
  ansible.builtin.command: "systemctl --user is-active {{ repo_unidade }}"
  register: repo_ativo
  changed_when: false
  failed_when: false

# Uma unidade que falhou ou terminou continua "carregada" no systemd e impede
# que outra com o mesmo nome suba — foi o que quebrou a execução anterior.
# reset-failed limpa esse resíduo. Só roda quando a unidade não está ativa,
# para não derrubar um servidor que já esteja servindo.
- name: Limpar resíduo de execução anterior
  ansible.builtin.command: "systemctl --user reset-failed {{ repo_unidade }}"
  changed_when: false
  failed_when: false
  when: repo_ativo.stdout | trim != 'active'

- name: Subir o servidor HTTP do repositório
  ansible.builtin.command:
    argv:
      - systemd-run
      - --user
      - "--unit={{ repo_unidade }}"
      - "--collect"
      - python3
      - -m
      - http.server
      - "{{ repo_porta }}"
      - --bind
      - "{{ repo_bind_ip }}"
      - --directory
      - "{{ repo_dir_publicado }}"
  register: repo_subida
  changed_when: repo_subida.rc == 0
  when: repo_ativo.stdout | trim != 'active'

- name: Aguardar o servidor HTTP responder
  ansible.builtin.wait_for:
    host: "{{ repo_bind_ip }}"
    port: "{{ repo_porta }}"
    timeout: 30

- name: Informar a URL do repositório
  ansible.builtin.debug:
    msg: >-
      Repositório disponível em {{ repo_interno_url }}
      ({{ repo_conteudo.matched }} arquivos). Para derrubar ao final:
      ansible-playbook repo_local.yml -e repo_acao=parar
