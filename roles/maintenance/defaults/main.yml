---
# inventario_dir mudou para group_vars/all/main.yml.
#
# Motivo: defaults de role só valem enquanto a role está sendo executada. O
# auditoria.yml, que não usa esta role, precisa do mesmo diretório para gravar
# os relatórios — e quebrava com "'inventario_dir' is undefined".
#
# Regra prática: variável consumida por mais de uma role ou por playbook
# avulso pertence a group_vars, não a defaults de role.
