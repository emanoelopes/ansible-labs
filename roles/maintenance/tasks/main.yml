---
# Toda tarefa desta role é opt-in: nada roda sem a tag correspondente.
#
# Antes isso era feito com uma trava dupla — 'tags: X' somada a
# 'when: "X in ansible_run_tags"'. As duas juntas produzem exatamente o mesmo
# efeito de 'tags: never,X', com o dobro da maquinaria e o efeito colateral de
# impedir que outro playbook componha estas tarefas. Unificado em ago/2026.

# Update tasks
- import_tasks: win_updates.yaml
  tags: never,win_updates

# Exporters
- import_tasks: windows_exporter.yml
  tags: never,windows_exporter

- import_tasks: node_exporter.yml
  tags: never,node_exporter

# Cleanup
- name: Trash Bin clean
  win_shell: rd /s /q %systemdrive%\$Recycle.bin
  args:
    executable: cmd
  ignore_errors: true
  ignore_unreachable: true
  tags: never,bin

# Utilities & Softwares
- import_tasks: nvda.yaml
  tags: never,nvda

- import_tasks: iprojection.yaml
  tags: never,iprojection

- import_tasks: sqlserver.yaml
  tags: never,sqlserver

- import_tasks: collect_hardware.yaml
  tags: never,collect_hardware

- import_tasks: collect_software.yaml
  tags: never,collect_software

- import_tasks: powerbi.yaml
  tags: never,powerbi

- import_tasks: seer.yaml
  tags: never,seer

- import_tasks: prepare_win_hosts.yaml
  tags: never,prepare_win_host

- import_tasks: ssd_health_status_windows.yml
  tags: never,ssd_health_status_windows

- import_tasks: opera_gx_removal.yaml
  tags: never,opera_gx_removal

- import_tasks: collect_macaddress.yaml
  tags: never,collect_macaddress
