- name: Coletar MAC Address e hostnames do Windows
  ansible.builtin.copy:
    # Antes era "./lista_mac_hostnames.yml": caminho relativo ao diretório de
    # onde o ansible-playbook foi chamado, o que gerava o arquivo em lugares
    # diferentes conforme o cwd — e foi assim que um lista_mac_hostnames.yml
    # acabou versionado na raiz do repositório.
    dest: "{{ inventario_dir }}/lista_mac_hostnames.yml"
    content: |
      # Arquivo gerado automaticamente em {{ ansible_date_time.date }}
      mac_to_hostname:
      {% for host in ansible_play_batch %}
      {% if hostvars[host]['ansible_default_ipv4']['macaddress'] is defined %}
        "{{ hostvars[host]['ansible_default_ipv4']['macaddress'] | lower }}": "{{ hostvars[host]['ansible_hostname'] | lower }}"
      {% else %}
        # {{ host }}: Nao foi possivel coletar o MAC Address da interface principal
      {% endif %}
      {% endfor %}
  delegate_to: localhost
  run_once: true
  become: false
  tags: never,collect_macaddress