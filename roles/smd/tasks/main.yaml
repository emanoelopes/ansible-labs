- name: DaVinci Resolve
  # when: ansible_facts['product_name'] == "Inspiron 5400 AIO"
  block:
    # Antes copiava davinci_zip_file (um .zip) e logo abaixo instalava
    # davinci_install_file (um .exe) que ninguém extraía — o fluxo não fechava.
    # Agora baixa direto o .exe do repositório. A variável davinci_zip_file
    # deixou de existir.
    - name: DaVinci Resolve - baixar instalador do repositório
      ansible.windows.win_get_url:
        url: "{{ repo_interno_url }}/{{ davinci_install_file }}"
        dest: "{{ downloads }}\\{{ davinci_install_file }}"
        force: no
      tags: never,davinci

    - name: DaVinci Resolve - Ensure is installed
      win_package:
        path: "{{ downloads }}/{{ davinci_install_file }}"
        arguments: /i /q
      ignore_errors: True
      tags: never,davinci

    - name: DaVinci Resolve - Remove installer file
      win_file:
        path: "{{ downloads }}/{{ davinci_install_file }}"
        state: absent
      ignore_errors: true
      tags: never,davinci


