# Lista em roles/smd/defaults/main.yml (smd_pacotes_chocolatey).
#
# Um pacote por tarefa, via loop: se a instalação fosse numa lista única, a
# primeira falha derrubaria as outras 26 e o relatório não diria qual quebrou.
# failed_when: false deixa o loop seguir, mas o resultado fica REGISTRADO — a
# tarefa seguinte reporta o que falhou, em vez de engolir o erro.
- name: Install chocolatey packages
  win_chocolatey:
    name: "{{ item }}"
    state: latest
  loop: "{{ smd_pacotes_chocolatey }}"
  register: choco_result
  failed_when: false
  tags: never,faixa2

- name: Listar pacotes Chocolatey que falharam
  ansible.builtin.debug:
    msg: >-
      Falharam nesta máquina:
      {{ choco_result.results | selectattr('failed') | map(attribute='item') | list }}
  when: choco_result.results | selectattr('failed') | list | length > 0
  tags: never,faixa2

- name: Falhar se algum pacote não instalou
  ansible.builtin.fail:
    msg: >-
      {{ choco_result.results | selectattr('failed') | list | length }} de
      {{ smd_pacotes_chocolatey | length }} pacotes não instalaram.
      Ver a tarefa anterior para a lista.
  when:
    - choco_result.results | selectattr('failed') | list | length > 0
    - not (choco_ignorar_falhas | default(false))
  tags: never,faixa2

- name: Upgrade all Chocolatey packages
  win_chocolatey:
    name: all
    state: latest
  tags: never,choco_upgrade_all

- name: Arduino Install and preparation
  block:
    - name: Copy zip file to the target
      ansible.windows.win_get_url:
        url: "{{ arduino_url_address }}"
        dest: "{{ aplicativos_dir }}"
      ignore_errors: True
    - name: nzip Install file
      community.windows.win_unzip:
        src: '{{ aplicativos_dir }}\{{ arduino_file_zip }}'
        dest: '{{ aplicativos_dir }}\Arduino'
        delete_archive: yes
      ignore_errors: True
    - name: Create shortcut on the desktop
      community.windows.win_shortcut:
        src: C:\Aplicativos\Arduino\Arduino Ide.exe
        dest: c:\users\aluno\desktop\Arduino.lnk
      ignore_errors: True
    - name: Add firewall rule for mdns-discovery on private network TCP
      win_firewall_rule:
        name: mdns-discovery TCP
        program: C:\users\aluno\appdata\local\arduino15\packages\bultin\tools\mdns-discovery\1.0.9\mdns-discovery.exe
        state: present
        enabled: yes
        action: allow
        direction: in
        localport: any
        localip: any
        remoteport: any
        remoteip: any
        protocol: tcp
        profiles: private
    - name: Add firewall rule for mdns-discovery on private network UDP
      win_firewall_rule:
        name: mdns-discovery UDP
        program: C:\users\aluno\appdata\local\arduino15\packages\bultin\tools\mdns-discovery\1.0.9\mdns-discovery.exe
        state: present
        enabled: yes
        action: allow
        direction: in
        localport: any
        localip: any
        remoteport: any
        remoteip: any
        protocol: udp
        profiles: private
    - name: Add firewall rule to provide access to arduino ide
      win_firewall_rule:
        name: Arduino IDE TCP
        program: C:\Aplicativos\Arduino\Arduino Ide.exe
        state: present
        enabled: yes
        action: allow
        direction: in 
        localport: any
        localip: any
        remoteport: any
        remoteip: any
        protocol: tcp
        profiles: private
    - name: Add firewall rule for Arduino IDE on private network UDP
      win_firewall_rule:
        name: Arduino IDE UDP
        program: C:\Aplicativos\Arduino\Arduino Ide.exe
        state: present
        enabled: yes
        action: allow
        direction: in
        localport: any
        localip: any
        remoteport: any
        remoteip: any
        protocol: udp
        profiles: private

  
