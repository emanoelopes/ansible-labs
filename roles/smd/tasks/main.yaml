- name: Safe Exam Browser (SEB)
  block:
    - name: Create a directory c:\temp
      ansible.windows.win_file:
        path: C:\Temp\
        state: directory
      ignore_errors: True
    - name: Baixar SEB
      ansible.windows.win_get_url:
        url: https://github.com/SafeExamBrowser/seb-win-refactoring/releases/download/v3.9.0/SEB_3.9.0.787_SetupBundle.exe
        dest: C:\Temp\SEB.msi
    - name: Instalar SEB silenciosamente
      ansible.windows.win_package:
        path: C:\Temp\SEB.msi
        state: present
        arguments: /quiet /norestart
    - name: Apagar arquivo de instalacao SEB
      ansible.windows.win_file:
        path: C:\Temp\SEB.msi
        state: absent
      ignore_errors: True
    - name: Create a directory C:\Users\aluno\AppData\Roaming\SafeExamBrowser\
      ansible.windows.win_file:
        path: C:\Users\aluno\AppData\Roaming\SafeExamBrowser\
        state: directory
      ignore_errors: True
    # O src anterior era um caminho absoluto dentro do home do Peterson
    # (/home/peterson/ansible-labs/...), então só funcionava na máquina dele.
    # O arquivo .seb é específico de cada prova: publique-o no compartilhamento
    # e informe o nome em seb_arquivo_prova.
    - name: Baixar arquivo de configuração da prova SEB
      ansible.windows.win_get_url:
        url: "{{ repo_interno_url }}/{{ seb_arquivo_prova }}"
        dest: C:\Users\aluno\AppData\Roaming\SafeExamBrowser\SebClientSettings.seb
        force: yes
  tags: never,seb

- name: Veyon Install
  block:
    - name: Remove a file, if present
      ansible.windows.win_file:
        path: '{{ dir_veyon }}'
        state: absent
      ignore_errors: true
    - name: Create a directory {{ dir_veyon }}
      ansible.windows.win_file:
        path: '{{ dir_veyon }}'
        state: directory
      ignore_errors: false
    # Instalador e artefatos vindos do repositório interno: o .exe é binário
    # (excluído pelo .gitignore) e o config.json e a chave pública são
    # específicos da instalação do Veyon Master.
    - name: Baixar o instalador do Veyon do repositório interno
      ansible.windows.win_get_url:
        url: '{{ repo_interno_url }}/{{ install_file_veyon }}'
        dest: '{{ dir_veyon }}\{{ install_file_veyon }}'
        force: no
    - name: Baixar o config.json do Veyon
      ansible.windows.win_get_url:
        url: '{{ repo_interno_url }}/{{ config_json_file }}'
        dest: '{{ dir_veyon }}\{{ config_json_file }}'
        force: no
    - name: Baixar a chave pública do Veyon
      ansible.windows.win_get_url:
        url: '{{ repo_interno_url }}/{{ public_key_veyon_file }}'
        dest: '{{ dir_veyon }}\{{ public_key_veyon_file }}'
        force: no
    # chdir corrigido: o instalador está em dir_veyon. O valor anterior
    # (c:\Program Files\Veyon\) aponta para um diretório que só passa a
    # existir DEPOIS da instalação, então a tarefa nunca poderia funcionar.
    - name: Install Veyon windows.win_command
      ansible.windows.win_command:
        cmd: '{{ file_name_veyon }} /S /NoMaster /ApplyConfig={{ dir_veyon }}\{{ config_json_file }}'
        chdir: '{{ dir_veyon }}'
        creates: 'C:\Program Files\Veyon\veyon-cli.exe'
    # O veyon-cli.exe fica em C:\Program Files\Veyon\, não em dir_veyon.
    # Chamá-lo pelo nome nu só funcionaria se o instalador tivesse colocado o
    # diretório no PATH. Usamos o caminho completo ({{ veyon_cli }}) e mantemos
    # o chdir em dir_veyon, que é onde estão a chave e o config.json passados
    # como argumento.
    - name: Remove keys if they exist
      ansible.windows.win_command:
        cmd: '"{{ veyon_cli }}" authkeys delete {{ veyon_nome_chave }}'
        chdir: '{{ dir_veyon }}'
      register: veyon_delete_key
      failed_when: false
      changed_when: veyon_delete_key.rc == 0
    - name: Import public Key
      ansible.windows.win_command:
        cmd: '"{{ veyon_cli }}" authkeys import {{ veyon_nome_chave }} {{ public_key_name_veyon }}'
        chdir: '{{ dir_veyon }}'
    - name: Import config.json again just in case
      ansible.windows.win_command:
        cmd: '"{{ veyon_cli }}" config import {{ config_json_name }}'
        chdir: '{{ dir_veyon }}'
    - name: Restart veyon service
      ansible.windows.win_command:
        cmd: '"{{ veyon_cli }}" service restart'
        chdir: '{{ dir_veyon }}'
      changed_when: true
    - name: Remove a file
      ansible.windows.win_file:
        path: '{{ dir_veyon }}\{{ file_name_veyon }}'
        state: absent
      ignore_errors: True
  tags: never,veyon

- name: Zbrush Core Mini Install
  block:
    - name: Ensure Temp directory exists
      ansible.windows.win_file:
        path: "{{ user_temp_folder }}"
        state: directory

    - name: Verify ZBrush Install File
      ansible.windows.win_stat:
        path: '{ user_temp_folder }}\{{ zbrush_install_file }}'
      register: zbrush_verify

    - name: Copy install file to hosts
      ansible.windows.win_get_url: 
        url: "{{ zbrush_url }}"
        dest: "{{ user_temp_folder }}"
        force: yes
      ignore_errors: true
      when: not zbrush_verify.stat.exists

    - name: Install
      ansible.windows.win_command:
        cmd: '{{ user_temp_folder }}\{{ zbrush_install_file }} --unattendedmodeui none --mode unattended'
        chdir: '{{ user_temp_folder }}'
      register: zbrush_install
        # ignore_errors: True

    - name: Remove a file.
      ansible.windows.win_file:
        path: '{{ user_temp_folder }}\{{ zbrush_install_file }}'
        state: absent
      ignore_errors: True
      when: zbrush_install is succeeded
  tags: never,zbrush_core_mini
