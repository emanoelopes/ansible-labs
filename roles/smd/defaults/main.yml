---
# --- Veyon --------------------------------------------------------------------

# Caminho completo do CLI do Veyon na estação, após a instalação.
veyon_cli: 'C:\Program Files\Veyon\veyon-cli.exe'

# Nome da chave de autenticação DENTRO do Veyon — não é nome de arquivo.
# É o mesmo identificador usado no 'authkeys import'. O 'authkeys delete'
# espera este valor; antes recebia o nome do .pem, o que nunca casaria.
veyon_nome_chave: 'LaboratoriosSMD/public'

# --- Safe Exam Browser --------------------------------------------------------

# Arquivo de configuração da prova, publicado no compartilhamento Samba.
# Muda a cada prova — sobrescreva na linha de comando quando for o caso:
#   ansible-playbook site.yaml -e local=lab2 -t seb \
#     -e seb_arquivo_prova=SebClientSettings-NomeDaProva.seb
seb_arquivo_prova: 'SebClientSettings.seb'

# --- Chocolatey ---------------------------------------------------------------

# Pacotes Chocolatey instalados nas estações do SMD.
#
# Fica em defaults/ (e não em vars/) de propósito: assim dá para sobrescrever a
# lista por laboratório em group_vars/lab1.yml, group_vars/lab2.yml etc., que é
# o passo seguinte rumo ao estado declarativo por lab.
smd_pacotes_chocolatey:
  - asio4all            # driver de som para o Reaper
  - anaconda3
  - arduino             # smd0112
  - audacity            # smd0047
  - bitvise-ssh-client
  - firefox
  - fontforge
  - foxitreader
  - gimp                # smd0056,smd0057,smd0088,smd0089,smd0098,smd0105,smd0110
  - git
  - inkscape            # smd0088,smd0105,smd0110
  - krita               # smd0057,smd0089,smd0098
  - libreoffice-fresh
  - nodejs
  - octave              # smd0047
  - openjdk
  - pgadmin4
  - postman
  - pycharm-community
  - python
  - reaper
  - selenium
  - tightvnc
  - vscode
  - wacom-drivers
  - winrar
  - wireshark
