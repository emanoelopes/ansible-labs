---
# Habilita o Subsistema Windows para Linux (WSL) e atualiza o kernel.
#
#   ansible-playbook wsl.yaml -e alvo=lab2
#
# O reboot é condicional: só ocorre se a ativação do recurso pedir. Como ele
# derruba a aula em andamento, considere rodar fora do horário de uso.

- name: Subsistema Windows para Linux
  hosts: "{{ alvo | default('nao_definido') }}"
  gather_facts: false

  tasks:
    - name: Verificar/ativar o recurso WSL
      ansible.windows.win_optional_feature:
        name: Microsoft-Windows-Subsystem-Linux
        state: present
      register: wsl_status

    - name: Reiniciar se a ativação do WSL exigir
      ansible.windows.win_reboot:
      when: wsl_status.reboot_required
      tags: reboot

    - name: Atualizar o kernel do WSL
      ansible.windows.win_package:
        path: https://wslstorestorage.blob.core.windows.net/wslblob/wsl_update_x64.msi
        state: present
      tags: update

