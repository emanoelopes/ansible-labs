---
# Instala o windows_exporter do Prometheus nas estações Windows.
#
#   piloto:       ansible-playbook windows_exporter.yml -e alvo=lab2 --limit 211
#   laboratório:  ansible-playbook windows_exporter.yml -e alvo=lab2
#   parque todo:  ansible-playbook windows_exporter.yml -e alvo=windows
#
#   só conferir, sem instalar:
#                 ansible-playbook windows_exporter.yml -e alvo=lab2 -t verificar
#
# Requer o espelho HTTP no ar:  ansible-playbook repo_local.yml
#
# ── O QUE É ───────────────────────────────────────────────────────────────
#
# Agente que expõe métricas da máquina (CPU, memória, disco, serviços) em
# http://<estação>:9182/metrics, para o Prometheus coletar. Roda como
# serviço do Windows — não é aplicativo de usuário, então NÃO cai na
# armadilha de perfil que custou tempo com Arduino, Figma e NetBeans.
#
# ── ANTES DE RODAR: PÔR O MSI NO ESPELHO ──────────────────────────────────
#
# Baixe de https://github.com/prometheus-community/windows_exporter/releases
# a versão amd64 e copie para a pasta 'windows_instaladores' do Samba
# (//10.44.24.130/smd). Ajuste 'we_arquivo' abaixo, ou passe
#   -e we_arquivo=windows_exporter-0.31.3-amd64.msi
#
# Baixar do espelho e não do GitHub é deliberado: são 130 estações, e o
# release do GitHub tem limite de taxa. Também protege do que já aconteceu
# com os instaladores da Apache — versão antiga sumir do servidor de origem
# e o playbook quebrar sozinho, sem ninguém ter mexido em nada.
#
# ── COLETORES ─────────────────────────────────────────────────────────────
#
# O padrão do exporter é enxuto. 'we_coletores' acrescenta o que interessa
# num laboratório: serviços (para saber se o Veyon ou o VNC caíram),
# processos e estado do disco físico. Cada coletor custa tempo de resposta,
# então a lista é deliberadamente curta — não se liga tudo "porque existe".

- name: windows_exporter
  hosts: "{{ alvo | default('nao_definido') }}"
  gather_facts: false
  serial: '25%'
  max_fail_percentage: 20

  # ── OBRIGATÓRIO NUM PARQUE LIGADO SOB DEMANDA ─────────────────────────
  #
  # Sem isto, máquina desligada conta como FALHA, e 'max_fail_percentage'
  # aborta a execução. Em 18/09/2026 a primeira leva do lab1 caiu inteira —
  # seis de seis inalcançáveis, 100% acima do limite de 20% — e o playbook
  # parou ali. As outras 21 nem foram tentadas, incluindo as ligadas.
  #
  # Estação apagada é o estado NORMAL aqui fora do horário de aula. Ela não
  # é erro: é ausência, e deve ser pulada. 'max_fail_percentage' continua
  # valendo para falha de verdade — instalador que quebra, serviço que não
  # sobe —, que é o que ele existe para conter.
  ignore_unreachable: true

  vars:
    we_arquivo: 'windows_exporter-0.31.8-amd64.msi'
    we_destino: 'C:\Temp\{{ we_arquivo }}'
    we_porta: 9182
    # Os oito primeiros são EXATAMENTE o padrão da versão 0.31.8, lido do
    # próprio binário:
    #   windows_exporter.exe --help | primeira linha de --collectors.enabled
    #
    # Não invente nomes a partir de documentação ou memória: 'cs' e 'logon'
    # existiam em versões anteriores, foram removidos, e cada um derrubou o
    # serviço na partida com 'unknown collector <nome>' — um de cada vez, o
    # que custou duas rodadas de diagnóstico em 21/09/2026. Ao trocar de
    # versão do MSI, confira a lista no binário novo antes de aplicar.
    #
    # Acrescentados aos padrões, ambos confirmados no --help da mesma versão:
    #   textfile  métricas próprias, se um dia quisermos publicar algo do
    #             laboratório que o exporter não mede
    #   time      sincronismo de relógio — relógio fora de hora quebra
    #             autenticação de domínio, e o sintoma não parece ser isso
    #
    # Deliberadamente FORA: 'process'. Ele existe, mas rende uma série por
    # processo por máquina, o que num parque de 154 estações é volume
    # desproporcional ao que responde. Entra quando houver pergunta que só
    # ele responda.
    we_coletores: 'cpu,memory,logical_disk,physical_disk,net,os,service,system,textfile,time'
    # De onde o Prometheus vai coletar: o Mac mini de observabilidade,
    # 10.102.227.250, IP fixo desde 21/09/2026.
    #
    # Host único, não sub-rede. Até aqui o valor era '10.102.227.0/24', que
    # liberava o segmento inteiro — as métricas do windows_exporter não são
    # inócuas: 'logon' entrega quem está logado, 'process' entrega o que está
    # rodando. Abrir isso para as estações dos próprios alunos era aceitável
    # só enquanto era piloto de três máquinas.
    #
    # A regra tem nome fixo ('Prometheus windows_exporter'), então reexecutar
    # SUBSTITUI o escopo antigo nas máquinas que já receberam o /24; não
    # acumula uma segunda regra permissiva ao lado.
    we_prometheus_ip: '10.102.227.250'

  pre_tasks:
    - name: Confirmar que o alvo foi informado
      ansible.builtin.fail:
        msg: "Informe o alvo: ansible-playbook windows_exporter.yml -e alvo=lab2"
      when: alvo is not defined
      run_once: true
      delegate_to: localhost
      tags: always

  tasks:
    # ── VERIFICAÇÃO ───────────────────────────────────────────────────────
    - name: Ver se o serviço já existe
      ansible.windows.win_service_info:
        name: windows_exporter
      register: we_servico
      failed_when: false
      tags: [always, verificar]

    - name: Parar aqui quando for só verificação
      ansible.builtin.meta: end_play
      when: "'verificar' in ansible_run_tags"
      tags: [always, verificar]

    # ── INSTALAÇÃO ────────────────────────────────────────────────────────
    - name: Garantir a pasta temporária
      ansible.windows.win_file:
        path: 'C:\Temp'
        state: directory
      when: we_servico.services | default([]) | length == 0

    - name: Baixar o MSI do espelho local
      ansible.windows.win_get_url:
        url: "{{ repo_interno_url }}/{{ we_arquivo }}"
        dest: "{{ we_destino }}"
        force: false
      register: we_download
      ignore_errors: true
      when: we_servico.services | default([]) | length == 0

    - name: Avisar quando o MSI não chegou
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }}: não foi possível baixar
          {{ repo_interno_url }}/{{ we_arquivo }}. Confira se o arquivo está
          na pasta windows_instaladores do Samba e se o espelho está no ar
          (ansible-playbook repo_local.yml).
      when:
        - we_servico.services | default([]) | length == 0
        - we_download is failed

    # ENABLED_COLLECTORS e LISTEN_PORT são propriedades públicas do MSI do
    # windows_exporter: ele as grava na configuração do serviço na hora da
    # instalação. Mudar depois exige reinstalar ou editar o serviço à mão.
    # SÓ PROPRIEDADES EM 'arguments' — nada de /quiet, /qn ou /passive.
    #
    # O win_package já passa '/qn /norestart' ao msiexec por conta própria.
    # Acrescentar '/quiet' põe dois flags de interface na mesma linha, e o
    # msiexec a rejeita com o erro 1639 (invalid command line) — sem que o
    # win_package traduza isso em falha. O resultado é instalação relatada
    # como bem-sucedida e nenhum serviço na máquina.
    #
    # Foi o que aconteceu no lab1 em 18/09/2026, nas seis primeiras
    # estações. Mesma assinatura do pacote 'netbeans' do Chocolatey: sucesso
    # declarado, produto ausente.
    - name: Instalar o windows_exporter
      ansible.windows.win_package:
        path: "{{ we_destino }}"
        state: present
        arguments: >-
          ENABLED_COLLECTORS={{ we_coletores }}
          LISTEN_PORT={{ we_porta }}
      register: we_install
      when: we_servico.services | default([]) | length == 0

    # ── COLETORES ─────────────────────────────────────────────────────────
    #
    # A lista de coletores NÃO vive na linha de comando do serviço: o MSI a
    # grava em config.yaml, e é de lá que o exporter lê a cada partida.
    #
    # Por que isto existe, em vez de confiar no ENABLED_COLLECTORS do MSI:
    # win_package com state: present não faz nada quando a mesma versão já
    # está instalada. Mudar we_coletores e reexecutar daria 'ok' em todas as
    # máquinas sem alterar coletor nenhum — o playbook relataria convergência
    # enquanto o serviço seguisse morto. Gerenciar o arquivo torna a lista de
    # fato declarada: muda aqui, muda na máquina, sem reinstalar.
    #
    # Foi o que custou 21/09/2026: as três máquinas do piloto subiram em
    # 18/09 e morreram no primeiro reinício com 'unknown collector cs'. O
    # coletor 'cs' saiu das versões recentes — o que ele media (hostname,
    # processadores lógicos, memória física) hoje vem de os, cpu e memory.
    - name: Declarar os coletores em config.yaml
      ansible.windows.win_copy:
        dest: 'C:\Program Files\windows_exporter\config.yaml'
        content: |
          collectors:
            enabled: {{ we_coletores }}
      register: we_config

    # ── E A LINHA DE COMANDO DO SERVIÇO PRECISA CALAR ─────────────────────
    #
    # O MSI grava o ENABLED_COLLECTORS como '--collectors.enabled ...' no
    # ImagePath do serviço, e argumento de linha de comando VENCE o
    # config.yaml. Sem esta tarefa, gerenciar o arquivo não serve para nada:
    # ele fica correto e ignorado, o serviço segue lendo a lista congelada no
    # dia da instalação, e um reinício não muda nada.
    #
    # Foi o que escondeu a causa por três rodadas em 21/09/2026. O sintoma
    # era contraditório de propósito: em primeiro plano o exporter subia com
    # os dez coletores e escutava na 9182, enquanto o mesmo binário, como
    # serviço, morria calado.
    #
    # Deixando só o --config.file, a lista passa a vir de um único lugar — e
    # aí 'we_coletores' é de fato declarado.
    - name: Tirar a lista de coletores da linha de comando do serviço
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\windows_exporter
        name: ImagePath
        data: '"C:\Program Files\windows_exporter\windows_exporter.exe" --config.file="C:\Program Files\windows_exporter\config.yaml"'
        type: expandstring
      register: we_imagepath

    # Reinício explícito, não handler: handler roda no fim da play, depois
    # das tarefas de conferência — a porta seria testada contra o serviço
    # ainda com a configuração antiga, e um ajuste correto apareceria como
    # falha.
    - name: Reiniciar o exporter quando a configuração mudou
      ansible.windows.win_service:
        name: windows_exporter
        state: restarted
      register: we_restart
      ignore_errors: true
      when: we_config is changed or we_imagepath is changed

    # ── FIREWALL ──────────────────────────────────────────────────────────
    #
    # Sempre executada, mesmo onde o exporter já estava: a regra pode ter
    # sido perdida numa reimagem enquanto o serviço permaneceu.
    - name: Liberar a porta do exporter só para o Prometheus
      community.windows.win_firewall_rule:
        name: Prometheus windows_exporter
        localport: "{{ we_porta }}"
        remoteip: "{{ we_prometheus_ip }}"
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true

    # ── CONFERÊNCIA ───────────────────────────────────────────────────────
    #
    # Confere o RESULTADO, não o código de saída. Instalador que termina com
    # zero e não entrega nada já aconteceu aqui: o pacote 'netbeans' do
    # Chocolatey relatou "install was successful" sem produto na máquina.
    - name: Conferir que o serviço subiu
      ansible.windows.win_service_info:
        name: windows_exporter
      register: we_depois
      failed_when: false

    # Quando o serviço não aparece, é preciso saber se o MSI chegou a
    # instalar ALGUMA coisa. Entrada no registro sem serviço aponta para
    # produto errado ou instalação parcial; nenhuma entrada aponta para o
    # msiexec ter recusado a linha de comando — que foi o caso de 18/09.
    - name: Levantar o que o MSI registrou
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'SilentlyContinue'
        $chaves = @(
          'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )
        $achado = Get-ItemProperty $chaves |
                  Where-Object { $_.DisplayName -like '*xporter*' }
        if ($achado) {
          $achado | ForEach-Object { 'REGISTRADO: ' + $_.DisplayName + ' ' + $_.DisplayVersion }
        } else {
          'NADA REGISTRADO'
        }
      register: we_registro
      changed_when: false
      ignore_errors: true
      when: we_depois.services | default([]) | length == 0

    # ignore_errors: serviço que não inicia é informação, não motivo para
    # abortar o host — e abortando, o relatório nunca é composto e o
    # operador fica sem saber POR QUE não iniciou. Foi o que aconteceu com
    # a 113 do lab1 em 18/09/2026: o host morreu na tarefa e as seguintes,
    # inclusive o diagnóstico, não rodaram.
    - name: Garantir que o serviço está rodando e é automático
      ansible.windows.win_service:
        name: windows_exporter
        state: started
        start_mode: auto
      register: we_start
      ignore_errors: true
      when: we_depois.services | default([]) | length > 0

    # O motivo de um serviço não iniciar está no Log de Eventos, não no
    # retorno do comando que tentou iniciá-lo. Sem isto, "falha ao iniciar"
    # é tudo o que se sabe — e é justamente o que não ajuda.
    - name: Ler por que o serviço não iniciou
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'SilentlyContinue'

        'ESTADO DO SERVIÇO'
        Get-CimInstance Win32_Service -Filter "Name='windows_exporter'" |
          Select-Object State, StartMode, PathName, ExitCode |
          Format-List | Out-String

        'PORTA 9182 JÁ EM USO?'
        $emUso = Get-NetTCPConnection -LocalPort 9182 -State Listen -ErrorAction SilentlyContinue
        if ($emUso) {
          foreach ($c in $emUso) {
            $p = Get-Process -Id $c.OwningProcess -ErrorAction SilentlyContinue
            'ocupada por: ' + $p.ProcessName + ' (PID ' + $c.OwningProcess + ')'
          }
        } else { 'livre' }

        'ÚLTIMOS EVENTOS'
        Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} |
          Where-Object { $_.ProviderName -like '*exporter*' -or $_.Message -like '*exporter*' } |
          Select-Object -First 5 |
          ForEach-Object { $_.TimeCreated.ToString('HH:mm:ss') + ' ' + ($_.Message -split "`n")[0] }

        Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'; StartTime=(Get-Date).AddMinutes(-15)} |
          Where-Object { $_.Message -like '*exporter*' } |
          Select-Object -First 5 |
          ForEach-Object { $_.TimeCreated.ToString('HH:mm:ss') + ' ' + ($_.Message -split "`n")[0] }
      register: we_diag
      changed_when: false
      ignore_errors: true
      when:
        - we_depois.services | default([]) | length > 0
        - we_start is defined
        - we_start is failed

    # Serviço rodando não prova que a porta responde: o coletor pode falhar
    # na inicialização e o serviço ficar de pé sem servir métricas.
    - name: Conferir que a porta responde
      ansible.windows.win_wait_for:
        port: "{{ we_porta }}"
        host: 127.0.0.1
        timeout: 30
      register: we_porta_ok
      ignore_errors: true

    - name: Resultado
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {% if we_depois.services | default([]) | length == 0 %}
          FALHOU — o serviço não existe depois da instalação.
          {{ we_registro.stdout | default('') | trim }}
          {% if 'NADA REGISTRADO' in (we_registro.stdout | default('')) %}
          Nada foi registrado: o msiexec provavelmente recusou a linha de
          comando. Confira se 'arguments' traz SÓ propriedades — o
          win_package já passa /qn por conta própria, e um /quiet a mais
          gera o erro 1639.
          {% else %}
          Algo foi registrado mas sem serviço: o MSI é mesmo o do
          windows_exporter, versão amd64?
          {% endif %}
          {% elif we_start is defined and we_start is failed %}
          serviço instalado, mas NÃO INICIA.
          {{ we_diag.stdout | default('(sem diagnóstico)') | trim }}
          Se a porta aparece ocupada acima, outro exporter ou uma instalação
          anterior ainda está de pé — pare-a antes de reinstalar. Se o log
          cita um coletor, tire-o de we_coletores.
          {% elif we_porta_ok is failed %}
          serviço instalado e iniciado, mas a porta {{ we_porta }} NÃO
          responde. Provável coletor inválido em we_coletores — o serviço sobe
          e morre ao inicializar. Veja o Log de Eventos, origem
          windows_exporter.
          {% else %}
          OK — http://{{ ansible_host | default(inventory_hostname) }}:{{ we_porta }}/metrics
          {% endif %}

    - name: Limpar o instalador
      ansible.windows.win_file:
        path: "{{ we_destino }}"
        state: absent
      when: we_servico.services | default([]) | length == 0

# ── ALVOS PARA O PROMETHEUS ───────────────────────────────────────────────
#
# Gera o arquivo de targets em formato de service discovery por arquivo, que
# é o que o Prometheus lê sem precisar de recarga manual. Copie para o Mac
# mini e aponte um 'file_sd_configs' para ele.
#
# Escrito a partir do INVENTÁRIO, e não de quem respondeu: máquina desligada
# continua sendo alvo legítimo — o Prometheus a marcará como 'down', que é a
# informação certa. Gerar só com quem respondeu faria a estação apagada
# desaparecer do monitoramento em vez de aparecer como fora do ar.
- name: Gerar a lista de alvos para o Prometheus
  hosts: "{{ alvo | default('nao_definido') }}"
  gather_facts: false
  ignore_unreachable: true

  tasks:
    - name: Escrever prometheus-targets-{{ alvo }}.json
      ansible.builtin.copy:
        dest: "{{ inventario_dir }}/prometheus-targets-{{ alvo }}.json"
        mode: "0644"
        content: |
          [
            {
              "labels": {
                "laboratorio": "{{ alvo }}",
                "job": "windows_exporter"
              },
              "targets": [
          {% for h in groups[alvo] | sort %}
                "{{ hostvars[h].ansible_host | default(h) }}:{{ we_porta | default(9182) }}"{{ "," if not loop.last }}
          {% endfor %}
              ]
            }
          ]
      delegate_to: localhost
      become: false
      run_once: true
      vars:
        we_porta: 9182

    - name: Onde ficou
      ansible.builtin.debug:
        msg: >-
          {{ groups[alvo] | length }} alvo(s) em
          {{ inventario_dir }}/prometheus-targets-{{ alvo }}.json —
          copie para o Mac mini e aponte um file_sd_configs para ele.
      run_once: true
