---
- name: Main Execution Playbook
  hosts: '{{ local }}'
  serial: '25%'  
  ignore_unreachable: true
  roles:
    - smd 
    - hosts_file
    - sql_server_2014
  gather_facts: yes

  pre_tasks:
    - name: Choose High Performance energy power plan for 7010, 780, m3209, 5400AIO
      community.windows.win_power_plan:
        name: Alto desempenho 
      when: 
      - ansible_facts['product_name'] != "DB85PRO"

    - name: Choose high power plan for HP Compaq 6005
      community.windows.win_power_plan:
        name: Alto desempenho 
      when: ansible_facts['product_name'] == "HP Compaq 6005 Pro SFF PC" 

    - name: Ensure schedule task 'Shutdown everyday at 23:00' is present
      community.windows.win_scheduled_task:
        name: Desligar às 23h
        description: Desligar todos os dias às 23h
        actions:
        - path: shutdown.exe
          arguments: /s /f
        triggers:
        - type: daily
          start_boundary: '2022-05-06T23:00:00'
        username: SYSTEM
        run_level: highest
        wake_to_run: yes
        state: present
        enabled: yes

  tasks:
    # tags: always é obrigatório aqui.
    #
    # Sem ele, qualquer execução com --tags pula esta tarefa, a role nem
    # chega a ser carregada, e as tags internas dela ficam inalcançáveis.
    # Foi o que aconteceu em 01/09/2026 ao tentar
    #   ansible-playbook site.yaml -e local=lab2 -t collect_macaddress
    # — a play terminou sem fazer nada e sem reportar nada.
    #
    # Valia para TODAS as tags da role: win_updates, nvda, sqlserver,
    # powerbi, collect_hardware, opera_gx_removal. Nenhuma jamais executou
    # por este caminho.
    #
    # Carregar a role sempre é inofensivo: todas as tarefas dentro dela são
    # 'never', então nada roda sem a tag correspondente.
    - name: Run maintenance tasks
      ansible.builtin.include_role:
        name: maintenance
      tags: always

  post_tasks:
    - name: Choose Balanced energy power plan for 7010, 780, m3209, 5400AIO
      community.windows.win_power_plan:
        name: equilibrado 
      when: 
      - ansible_facts['product_name'] != "DB85PRO"

    - name: Set autologon for user aluno
      ansible.windows.win_auto_logon:
        username: aluno
        password: "{{ vault_senha_aluno }}"
      no_log: true
 

