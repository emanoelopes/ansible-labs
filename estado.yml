---
# Converge um laboratório para o estado declarado em group_vars/<lab>.yml.
#
# Ao contrário do site.yaml, este playbook NÃO depende de tags: rodar sem
# argumento nenhum significa "coloque estas máquinas no estado declarado".
#
#   auditar:   ansible-playbook estado.yml -e alvo=lab1 --check --diff
#   piloto:    ansible-playbook estado.yml -e alvo=lab1 --limit 111
#   aplicar:   ansible-playbook estado.yml -e alvo=lab1
#
# O modo --check é o detector de desvio: o que aparecer como 'changed' é
# exatamente o que está fora do estado declarado. Nada é alterado.

- name: Convergir laboratório para o estado declarado
  hosts: "{{ alvo | default('nao_definido') }}"
  gather_facts: true

  # 25% por vez ao APLICAR: se algo der errado, atinge um quarto do laboratório
  # e não ele inteiro. E max_fail_percentage interrompe antes de propagar um
  # erro sistemático para as demais levas.
  #
  # Em modo --check nada é alterado, então escalonar só multiplica o tempo de
  # espera. A auditoria sobrescreve com 100%:
  #   ansible-playbook estado.yml -e alvo=lab1 --check -e estado_serial=100%
  serial: "{{ estado_serial | default('25%') }}"
  max_fail_percentage: 20

  # ── SEM ISTO, UMA LEVA APAGADA DERRUBA A EXECUÇÃO INTEIRA ─────────────
  #
  # Quando TODOS os hosts de uma leva ficam inalcançáveis, o Ansible encerra
  # a play — não apenas aquela leva. Com serial de 25%, uma leva inteira
  # desligada é bem possível num parque ligado sob demanda, e as levas
  # seguintes nem seriam tentadas, incluindo máquinas ligadas.
  #
  # Este playbook escapou até 18/09/2026 por sorte: a auditoria o roda com
  # estado_serial=100%, uma leva só, e nunca houve um laboratório
  # inteiramente apagado no horário. O windows_exporter.yml, com o mesmo
  # desenho, parou na primeira leva do lab1 — seis de seis inalcançáveis.
  #
  # Estação apagada é o estado normal fora do horário de aula: é ausência,
  # não erro. 'max_fail_percentage' segue valendo para falha de verdade,
  # que é o que ele existe para conter.
  #
  # Os hosts inalcançáveis continuam registrados como tal nas estatísticas,
  # então a auditoria não perde a informação de cobertura.
  ignore_unreachable: true

  # Um role por família de SO. O 'when' no nível do role faz cada tarefa
  # interna ser pulada nos hosts que não combinam — lab3 (Darwin) pula
  # estado_lab por inteiro, os cinco labs Windows pulam estado_lab_macos.
  # Unificado em 11/09/2026: lab3 passou a caber no mesmo comando
  # (ansible-playbook estado.yml -e alvo=lab3) que os labs Windows, em vez
  # de ter playbook e nível de robustez próprios em lab3.yaml.
  # 'default('')' importa para o host inalcançável: sem gather_facts, o
  # dicionário fica sem a chave 'os_family', e o acesso direto por colchete
  # falha com erro fatal — não coberto por ignore_unreachable, que só
  # suprime falha de CONEXÃO. Sem o default, a máquina apagada volta a
  # derrubar a leva que a nota acima diz estar resolvida.
  roles:
    - role: estado_lab
      when: ansible_facts['os_family'] | default('') == 'Windows'
    - role: estado_lab_macos
      when: ansible_facts['os_family'] | default('') == 'Darwin'

  pre_tasks:
    - name: Avisar quando nenhum alvo foi informado
      ansible.builtin.fail:
        msg: >-
          Informe o laboratório: ansible-playbook estado.yml -e alvo=lab1
      when: alvo is not defined
      run_once: true
      delegate_to: localhost
