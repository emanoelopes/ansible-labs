---
# Manutenção do lab3 que NÃO é estado declarado.
#
# Pacotes (Homebrew + mas) e energia (suspensão, monitor, desligamento
# diário) saíram daqui em 11/09/2026 — ficaram em roles/estado_lab_macos,
# acionado por estado.yml, igual aos cinco labs Windows:
#
#   auditar:  ansible-playbook estado.yml -e alvo=lab3 --check --diff
#   piloto:   ansible-playbook estado.yml -e alvo=lab3 --limit 311
#   aplicar:  ansible-playbook estado.yml -e alvo=lab3
#
# O que sobra aqui é o que não tem análogo no modelo de estado declarado:
# bootstrap do Homebrew (que o estado_lab_macos assume já resolvido, igual
# o estado_lab Windows assume o Chocolatey já presente), checagem de
# atualização do macOS (opt-in, tag macos_update) e remoção do usuário
# 'professor' do grupo admin.
- name: lab3
  hosts: "{{ local }}"
  gather_facts: true
  ignore_unreachable: true
  become: true
  vars:
    install_homebrew_if_missing: true
    homebrew_upgrade_all_packages: false
  pre_tasks:
    - name: Assert target is macOS Monterey (12.x)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Darwin'
          - ansible_facts['distribution_major_version'] | string == '12'
        fail_msg: "Este playbook é suportado apenas no macOS Monterey (12.x)."
        success_msg: "macOS Monterey detectado. Prosseguindo."
    # vars: ansible_become:false nas quatro tarefas de Homebrew abaixo
    # (achado em 11/09/2026, piloto na 311 — ver o comentário completo em
    # roles/estado_lab_macos/tasks/main.yml): o Homebrew se recusa a rodar
    # como root, e o instalador oficial (install.sh) também aborta se
    # detectar root. NOTA: a keyword 'become: false' sozinha NÃO resolve
    # aqui — group_vars/macos/ define ansible_become:true como variável, e
    # variável de conexão de inventário vence a keyword de task. É preciso
    # sobrescrever a própria variável via 'vars:'. Sem isso, as quatro
    # herdam o become:true do play, necessário para dseditgroup/
    # softwareupdate mais abaixo.
    - name: Ensuring Homebrew is Installed
      ansible.builtin.command: /usr/bin/which brew
      vars:
        ansible_become: false
      register: homebrew_check
      changed_when: false
      failed_when: false

    - name: Fail if Homebrew is not installed and install_homebrew_if_missing is false
      ansible.builtin.fail:
        msg: Homebrew is missing...Install from http://brew.sh
      when:
        - homebrew_check.rc != 0
        - not install_homebrew_if_missing

    - name: Installing Homebrew
      ansible.builtin.shell: NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      vars:
        ansible_become: false
      when:
        - homebrew_check.rc != 0
        - install_homebrew_if_missing

  tasks:
    - name: Updating Homebrew
      community.general.homebrew:
        update_homebrew: true
      vars:
        ansible_become: false
      when: homebrew_check.rc == 0

    - name: Upgrading Homebrew Packages
      community.general.homebrew:
        upgrade_all: "{{ homebrew_upgrade_all_packages }}"
      vars:
        ansible_become: false
      register: result

    - name: Check available macOS updates
      ansible.builtin.command: /usr/sbin/softwareupdate -l
      register: macos_update_check
      changed_when: false
      failed_when: false
      tags: never,macos_update
    - name: Update macOS (install all available updates)
      ansible.builtin.command: /usr/sbin/softwareupdate -ia
      when: macos_update_check.stdout is not search("No new software available.")
      tags: never,macos_update
    - name: Check if 'professor' is member of admin group
      command: dseditgroup -o checkmember -m professor admin
      register: professor_admin_check
      changed_when: false
      failed_when: false
    - name: Remove 'professor' from admin group if present
      command: dseditgroup -o edit -d professor -t user admin
      when: professor_admin_check.rc == 0

    - name: Verificar versão do Firefox
      shell: |
        if [ -d "/Applications/Firefox.app" ]; then
          /Applications/Firefox.app/Contents/MacOS/firefox --version
        else
          echo "Firefox não está instalado"
        fi
      register: firefox_current_version
      changed_when: false
      failed_when: false

    - name: Exibir versão do Firefox
      debug:
        msg: "{{ firefox_current_version.stdout }}"

    - name: shutdown hosts
      community.general.shutdown:
      tags: never,shutdown
